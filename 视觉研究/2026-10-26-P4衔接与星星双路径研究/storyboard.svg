"248" fill="white" stroke="black"/><path d="M214 675L764 923" stroke="black" fill="none"/><path d="M764 675L214 923" stroke="black" fill="none"/><rect x="222" y="777.0" width="534" height="40" fill="white"/><text x="232" y="804.0" font-size="18">真实功能页预览（不是另绘插画）</text><rect x="207" y="774" width="564" height="44" fill="white" stroke="black"/><text x="222" y="803" font-size="23">栏目标题带叠在预览之上</text><text x="830" y="694" font-size="24">总索引：五功能</text><text x="830" y="738" font-size="24">24 刻度：章节切换</text><text x="830" y="782" font-size="24">P4 列表：章内细分词条</text><text x="830" y="837" font-size="20">星星不可变成必须追逐的按钮。</text><text x="830" y="878" font-size="18">可见时点场景星；离场时由页边入口承接。</text><text x="830" y="919" font-size="18">关闭恢复原位；直达不重播整段开场。</text><text x="40" y="990" font-size="16">占位矩形不是徽章设计；星星停驻侧边未定；纸墨／正式图案／配色另行逐项审阅。</text></g></svg>