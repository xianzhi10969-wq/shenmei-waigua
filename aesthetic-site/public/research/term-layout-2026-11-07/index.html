<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>治愈 · 同屏排版结构</title><style>body{margin:0;background:white;color:black;font:16px/1.7 serif}header,footer{padding:20px 24px;max-width:960px;margin:auto}h1{font-size:24px;font-weight:400;margin:0 0 12px}p{margin:8px 0}nav{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}button,a{font:inherit;color:inherit}button{background:white;border:1px solid black;padding:6px 12px;cursor:pointer}main{border-block:1px solid black;overflow:auto}object{display:block;margin:auto;max-width:100%;height:auto}small{font-size:13px}</style><header><h1>吊灯靠右，核心短文回到首屏</h1><p>这一步只看位置与阅读顺序。吊灯是线稿占位；最终沿用原插画和已认可动效。</p><nav><button data-file="mobile" data-w="390" data-h="700">手机 390</button><button data-file="mobile-320" data-w="320" data-h="640">小屏 320</button><button data-file="mobile-430" data-w="430" data-h="740">手机 430</button><button data-file="desktop" data-w="1440" data-h="900">桌面</button><button id="grid">显示／隐藏对齐线</button></nav><a id="download" href="mobile.svg" download>下载可编辑 SVG</a></header><main><object data="mobile.svg" width="390" height="700" type="image/svg+xml" aria-label="首屏布局草图"></object></main><footer><p>灯向右移，底部吊坠抬高；标题和核心短文共用左边线。英文改成小标签，避免中文／英文／正文三段争抢视觉重点。</p><p>下一步的立体感：背景用有明暗变化的深墨色；灯芯暖光、灯身柔影；标题最亮，正文稍暖稍暗，英文更轻。先确认这张结构，再做实际光色。</p><p><a href="/terms/7265637a7a3238484a4a4c32474c4350/?opening=light">对照现有词条页与已认可动效</a></p></footer><script>const obj=document.querySelector('object');document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{obj.data=b.dataset.file+'.svg';obj.width=b.dataset.w;obj.height=b.dataset.h;document.querySelector('#download').href=obj.data});document.querySelector('#grid').onclick=()=>{const g=obj.contentDocument?.querySelector('#grid');if(g)g.setAttribute('display',g.getAttribute('display')==='none'?'inline':'none')};</script></html>
