<text id="title" x="32" y="268" font-size="52">治愈</text>
<text id="english" x="32" y="298" font-size="14" letter-spacing="1.2">HEALING</text>
<text id="introduction" x="32" y="354" font-size="18"><tspan x="32" dy="0">有人下班回家，发现门边那盆快枯的植物</tspan><tspan x="32" dy="28">被浇过水。没人站出来说“我要治好你”，</tspan><tspan x="32" dy="28">屋子却好像能再住一晚。做治愈若只放暖</tspan><tspan x="32" dy="28">色、绒毯和“你一定会好起来”，难处被</tspan><tspan x="32" dy="28">跳过去了，安慰也就落不到身上。</tspan></text><text id="navigation" x="32" y="514" font-size="12">← 田园图鉴　　全部专题</text><text id="continue" x="32" y="668" font-size="12">向下阅读作品 ↓</text></g>
