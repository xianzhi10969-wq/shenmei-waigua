<g id="chandelier" transform="translate(1120 330)" stroke="black" stroke-width="1.5" fill="none">
<path d="M0 -300V10M-110 -70Q0 80 110 -70M-70 -110Q0 10 70 -110M-110 -70V-130M-70 -110V-170M70 -110V-170M110 -70V-130"/>
