<title id="title">吊灯、水滴与词条名：桌面动线草图</title>
<desc id="desc">保留吊灯原位置。灯芯先亮，光沿吊坠聚成一滴；手机向下偏左，桌面向左下，到达词条标题上缘。标题随后显现。</desc>
