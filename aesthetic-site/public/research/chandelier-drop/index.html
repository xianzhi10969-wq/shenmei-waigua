<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吊灯 → 水滴 → 词条名 · 动线草图</title><style>body{margin:24px;color:#111;background:#fff;font:16px/1.7 serif}main{max-width:1000px;margin:auto}h1{font-size:25px;font-weight:400}nav{display:flex;gap:16px;flex-wrap:wrap}button,a{font:inherit;color:inherit;background:white;border:1px solid black;padding:8px 14px}object{width:100%;height:70vh;border:1px solid #111;margin-top:24px}p{max-width:760px}#phase{min-height:30px}</style><main><h1>吊灯 → 一滴光 → 被照亮的词条名</h1><p>用户调整后的候选：吊灯轻晃与水滴下落同时开始，不熄灯、不等两次闪烁；约 1.45 秒完成标题照亮。</p><p>手机向下偏左；桌面沿现有右灯、左文的布局向左下。灯保留原位，只让光凝成一滴。此页仅演示动线与先后，不代表最终光效。</p><p><a href="/terms/7265637a7a3238484a4a4c32474c4350/?opening=light">打开治愈词条 · 实际光效候选</a></p><p>下方保留上一轮结构草图作对照；实际光效按上述同时发生的短版执行。</p><nav><button id="mobile">手机</button><button id="desktop">桌面</button><button id="replay">播放／重播</button><a id="source" href="mobile.svg">可编辑 SVG</a></nav><p id="phase" aria-live="polite">结构待审 · 不替换现有词条页</p><object data="mobile.svg" type="image/svg+xml" aria-label="可播放动线草图"></object></main><script>
const board=document.querySelector('object'),phase=document.querySelector('#phase');let animations=[],run=0;
function cancel(){run++;animations.forEach(a=>a.cancel());animations=[]}
async function play(){cancel();const token=run,doc=board.contentDocument;if(!doc)return;const lamp=doc.querySelector('#chandelier'),lights=doc.querySelector('#lights'),drop=doc.querySelector('#drop'),copy=doc.querySelector('#copy'),path=doc.querySelector('#drop-path');
const wait=ms=>new Promise(r=>setTimeout(r,ms));const anim=(el,frames,opts)=>{const a=el.animate(frames,{fill:'both',...opts});animations.push(a);return a};
copy.style.opacity=0;drop.style.opacity=0;phase.textContent='① 吊灯出现';anim(lamp,[{opacity:0},{opacity:1}],{duration:700});await wait(800);if(token!==run)return;
phase.textContent='② 灯芯轻亮两次，稳定';anim(lights,[{fill:'white'},{fill:'black'},{fill:'white'},{fill:'black'},{fill:'white'}],{duration:1400});await wait(1400);if(token!==run)return;
phase.textContent='③ 一滴光从吊坠落向标题';drop.style.opacity=1;const length=path.getTotalLength();const frames=Array.from({length:61},(_,i)=>{const p=path.getPointAtLength(length*i/60);return {transform:`translate(${p.x}px,${p.y}px)`}});anim(drop,frames,{duration:1300,easing:'cubic-bezier(.4,0,.8,1)'});await wait(1300);if(token!==run)return;
drop.style.opacity=0;phase.textContent='④ 词条名字被照亮，随后进入阅读';anim(copy,[{opacity:0},{opacity:1}],{duration:900});}
for(const mode of ['mobile','desktop'])document.querySelector('#'+mode).onclick=()=>{cancel();board.data=mode+'.svg';document.querySelector('#source').href=mode+'.svg'};document.querySelector('#replay').onclick=play;
</script></html>
