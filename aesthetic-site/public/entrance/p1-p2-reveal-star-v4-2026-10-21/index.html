<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>审美外挂 · P1 显影预览 v4</title>
<meta name="viewport" content="width=1440">
<style>
html,body{margin:0;background:#f9f6ef}
body{width:1440px;margin:0 auto;position:relative;overflow-x:hidden}
#p1{position:relative;width:1440px;height:900px;background:#f9f6ef}
#p1 .lay{position:absolute;left:0;top:64px;width:1440px;height:836px;opacity:0}
#text{position:absolute;left:0;top:0;width:1440px;height:900px;opacity:0;animation:fade 1.1s cubic-bezier(.22,.61,.36,1) .2s forwards}
#bg{animation:wipe 1.2s cubic-bezier(.22,.61,.36,1) 0s forwards}
#shrine{animation:wipe 1.0s cubic-bezier(.22,.61,.36,1) .7s forwards}
#woman{animation:wipe 1.1s cubic-bezier(.22,.61,.36,1) 1.2s forwards}
#star{position:absolute;left:720px;top:344px;width:156px;height:156px;z-index:5;will-change:transform;transform:translate3d(0,0,0)}
#star img{position:absolute;left:0;top:0;width:156px;height:156px;will-change:opacity}
#starIn{opacity:0;animation:starin .9s cubic-bezier(.22,.61,.36,1) 2.0s forwards}
#starCream{opacity:0}
@keyframes fade{to{opacity:1}}
@keyframes wipe{from{opacity:0;clip-path:inset(0 0 18% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes starin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
#p2{display:block;width:1440px;height:811px}
</style></head><body>
<section id="p1">
  <img class="lay" id="bg" src="assets/bg.png" alt="">
  <img class="lay" id="shrine" src="assets/shrine.png" alt="">
  <img class="lay" id="woman" src="assets/woman.png" alt="">
  <img id="text" src="assets/text.png" alt="">
</section>
<div style="position:relative"><img id="p2" src="assets/p2_nostar.png" alt=""><img id="p2star" src="assets/starB_cream.png" alt="" style="position:absolute;left:304px;top:470px;width:156px;height:156px;opacity:0"></div>
<div id="star"><img id="starIn" src="assets/starB_ink.png" alt=""><img id="starCream" src="assets/starB_cream.png" alt=""></div>
<script>
// Star B (P1 linework). Top-left (720,344) on P1 -> (304,1370) on P2; P2's own star is painted out and replaced by the same B_cream image
const st=document.getElementById('star'),ink=document.getElementById('starIn'),cream=document.getElementById('starCream');
const DX=304-720, DY=1370-344, TOPLINE=900, CY=78; const p2s=document.getElementById('p2star');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cl=(v,a,b)=>Math.min(1,Math.max(0,(v-a)/(b-a))), ss=t=>t*t*(3-2*t);
let ready=false,queued=false;
ink.addEventListener('animationend',()=>{ink.style.animation='none';ink.style.opacity=1;ready=true;update()});
window.__forceReady=()=>{ink.style.animation='none';ink.style.opacity=1;ready=true;update()};
function update(){queued=false; if(!ready)return;
  const max=document.documentElement.scrollHeight-innerHeight, p=reduce?0:Math.min(1,Math.max(0,scrollY/max));
  const g=ss(cl(p,.03,1));
  const x=DX*(1-Math.pow(1-g,2)), y=DY*(g*g*.35+g*.65);
  const r=4*Math.sin(Math.PI*g);                       // a barely-there sway, 0 at both ends
  st.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${r.toFixed(2)}deg)`;
  const cy=344+y+CY, c=ss(cl(cy,TOPLINE-30,TOPLINE+50)); // ink -> cream as it crosses into P2
  ink.style.opacity=1-c; cream.style.opacity=c;
  const done=p>=.999; st.style.opacity=done?0:1; p2s.style.opacity=done?1:0;                         // at rest it IS the drawn star: hand off
}
addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(update)}},{passive:true});
</script></body></html>
