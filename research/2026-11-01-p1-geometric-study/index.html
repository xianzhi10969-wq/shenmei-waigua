<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审美外挂 · 几何结构对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e6df;color:#282923;font:14px/1.6 system-ui,sans-serif}header{max-width:848px;margin:24px auto 20px;padding:0 20px}h1{font-size:19px;font-weight:500;margin:0}header p{margin:5px 0 16px;color:#65665e;font-size:13px}.controls{display:flex;flex-wrap:wrap;gap:7px}button{font:inherit;padding:7px 13px;border:1px solid #aaa99e;border-radius:3px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#33352f;color:#fff;border-color:#33352f}button:focus-visible,a:focus-visible{outline:2px solid #333;outline-offset:3px}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:28px;justify-content:center;padding:0 20px 30px}figure{margin:0;min-width:0}figcaption{font-size:12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px}.subtle{color:#74756c}.page{position:relative;width:100%;aspect-ratio:390/844;overflow:hidden;background:#f8f5ee}.page img{position:absolute;inset:0;display:block;width:100%;height:100%}.ornament{pointer-events:none}footer{max-width:848px;margin:0 auto;padding:0 20px 30px;font-size:12px;color:#65665e}footer a{color:inherit;text-underline-offset:3px}.structure img{visibility:hidden}.structure img.wireframe{visibility:visible}img.wireframe{visibility:hidden}body[data-mode=original] .ornament{visibility:hidden}.notice{margin:10px 0 0;font-size:12px;min-height:20px}@media(max-width:600px){header{margin-top:18px}.compare{grid-template-columns:minmax(0,390px);padding:0 12px 20px}.baseline{display:none}header{padding:0 16px}.controls{gap:5px}button{padding:7px 10px;font-size:12px}h1{font-size:17px}footer{padding:0 16px 24px}}
</style>
<body data-mode="original"><header><h1>几何方向保留 · 当前纹样需重做</h1><p>当前恢复原版。旧试稿存在风格不符、背景线重叠和笔触不协调的问题。</p><div class="controls" role="group" aria-label="切换对照版本"><button data-mode="original" aria-pressed="true">原版</button><button data-mode="geometry" aria-pressed="false">旧稿 A</button><button data-mode="hatched" aria-pressed="false">旧稿 B</button><button data-mode="structure" aria-pressed="false">旧结构稿</button></div><p class="notice" id="notice" aria-live="polite">已恢复原版；旧稿仅供复盘，不视为采用。</p></header>
<main class="compare"><figure class="baseline"><figcaption><span>原版</span><span class="subtle">已认可字标与原插画</span></figcaption><div class="page"><img src="../../web-prototypes/p3-stained-glass-v3-2026-10-23/assets/m_p1_notext_original_v20261101.png" alt="首页原插画"><img src="../../web-prototypes/p1-p3-continuous-2026-10-31/assets/p1-brand-companion-v20261101.svg" alt="审美外挂，从有感觉到有风格"></div></figure>
<figure><figcaption><span id="variant">A · 几何结构</span><span class="subtle">待审 · 静态合看</span></figcaption><div class="page" id="trial"><img src="../../web-prototypes/p3-stained-glass-v3-2026-10-23/assets/m_p1_notext_original_v20261101.png" alt="首页原插画"><img id="ornament" class="ornament" src="geometry.svg" alt="从上缘和右侧裁入的八向几何结构"><img src="../../web-prototypes/p1-p3-continuous-2026-10-31/assets/p1-brand-companion-v20261101.svg" alt="审美外挂，从有感觉到有风格"><img class="wireframe" src="structure.svg" alt="白底黑线结构稿：保留文字与插画区域"></div></figure></main>
<footer>这轮只比较位置、尺度与疏密。新增几何为可编辑路径，尚未细化为完成美术。<br><a href="../2026-11-01-geometric-ornament/">回看参考作品</a> · <a href="geometry.svg">线框 SVG</a> · <a href="hatched.svg">排线 SVG</a> · <a href="structure.svg">结构 SVG</a></footer>
<script>
document.getElementById('variant').textContent='原版';
const messages={original:'已认可的主副字标与原插画。',geometry:'旧稿：大切面与原画不协调，侵入已有背景线。',hatched:'旧稿：排线没有解决形态、尺度与背景重叠问题。',structure:'旧结构稿：背景避让范围不足，需重新组织。'};
document.querySelectorAll('button[data-mode]').forEach(button=>button.addEventListener('click',()=>{const mode=button.dataset.mode;document.body.dataset.mode=mode;document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('trial').classList.toggle('structure',mode==='structure');if(mode==='geometry'||mode==='hatched')document.getElementById('ornament').src=mode+'.svg';document.getElementById('variant').textContent=button.textContent;document.getElementById('notice').textContent=messages[mode];}));
</script></body></html>
