<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400"><rect width="1400" height="1400" fill="white"/><style>text{font-family:PingFang SC,sans-serif;fill:black;font-size:18px}.h{font-size:29px;font-weight:600}.sm{font-size:15px}.line{fill:none;stroke:black;stroke-width:1.5}</style><text x="45" y="50" class="h">接续结构候选 · 保留旧词条美术</text><text x="45" y="84" class="">黑线白底只讨论构图与内容次序；框、曲线均为位置示意，不是绘画。</text><text x="45" y="135" class="h">A  连续阅读：原扉页 → 插入图版 → 原有正文（优先验证）</text><text x="45" y="180" class="">P4 当前词条</text><rect x="45" y="200" width="290" height="245" class="line"/><rect x="105" y="228" width="170" height="140" class="line"/><rect x="113" y="236" width="154" height="124" class="line"/><text x="110" y="400" class="sm">同一词名 / 同一封面</text><text x="348" y="325" class="">→</text><text x="385" y="180" class="">原有词条开场</text><rect x="385" y="200" width="290" height="245" class="line"/><text x="403" y="235" class="h">原词名</text><text x="403" y="265" class="sm">原题句</text><rect x="550.3" y="220" width="87.0" height="154.35" class="line"/><path d="M515.5 208V429M515.5 208H663" class="line"/><text x="403" y="429" class="sm">原雕花 / 曲线美术保留</text><text x="688" y="325" class="">→</text><text x="725" y="180" class="">新风格拼贴</text><rect x="725" y="200" width="290" height="245" class="line"/><ellipse cx="815.5" cy="286.5" rx="60.0" ry="53.2" class="line"/><rect x="875.5" y="248.5" width="42.5" height="95.0" class="line"/><rect x="768.0" y="349.20000000000005" width="107.5" height="43.7" class="line"/><rect x="898.0" y="339.7" width="70.0" height="47.5" class="line"/><text x="743" y="430" class="sm">完整看板，非缩略图</text><text x="1028" y="325" class="">→</text><text x="1065" y="180" class="">原有导言与案例</text><rect x="1065" y="200" width="290" height="245" class="line"/><text x="1083" y="235" class="sm">已有核心 / 导言</text><path d="M1083 252L1335 252" class="line"/><rect x="1083" y="280" width="100" height="100" class="line"/><text x="1203" y="301" class="sm">原图与解读</text><path d="M1203 320L1335 320" class="line"/><path d="M1203 339L1335 339" class="line"/><text x="45" y="482" class="sm">P4 → 词条：承接作品身份与返回位置。画框形状不同，不强行变形为同一画框。</text><text x="45" y="510" class="sm">词条 → 拼贴：页边、图版编号及阅读方向延续；先验证静态接缝，再讨论动作。</text><text x="45" y="560" class="h">B  桌面并置：原扉页与拼贴同屏（比较项，不默认采用）</text><rect x="45" y="590" width="790" height="260" class="line"/><path d="M353 590L353 850" class="line"/><text x="63" y="625" class="h">原词名</text><text x="63" y="655" class="sm">原题句</text><rect x="220.55999999999997" y="610" width="92.39999999999999" height="163.8" class="line"/><path d="M183.6 598V834M183.6 598H341" class="line"/><text x="63" y="834" class="sm">原雕花 / 曲线美术保留</text><ellipse cx="506.8" cy="685.25" rx="100.8" ry="60.2" class="line"/><rect x="607.6" y="642.25" width="71.4" height="107.5" class="line"/><rect x="427.0" y="756.2" width="180.6" height="49.45" class="line"/><rect x="645.4" y="745.45" width="117.60000000000001" height="53.75" class="line"/><text x="875" y="625" class="">优点：更早看到拼贴</text><text x="875" y="665" class="">代价：两个视觉重点竞争</text><text x="875" y="705" class="">原封面需要重新适配窄幅</text><text x="875" y="745" class="">不能把原图直接缩小塞入</text><text x="875" y="800" class="sm">手机不照搬左右分栏</text><text x="45" y="905" class="h">手机 A · 自然向下阅读；可直接跳到图版或作品</text><text x="45" y="948" class="">进入词条</text><rect x="45" y="970" width="290" height="285" class="line"/><text x="63" y="1005" class="h">原词名</text><text x="63" y="1035" class="sm">原题句</text><rect x="210.29999999999998" y="990" width="87.0" height="154.35" class="line"/><path d="M175.5 978V1199M175.5 978H323" class="line"/><text x="63" y="1199" class="sm">原雕花 / 曲线美术保留</text><text x="61" y="1238" class="sm">看图版 / 看作品</text><text x="385" y="948" class="">扉页 / 图版接缝</text><rect x="385" y="970" width="290" height="285" class="line"/><text x="403" y="1005" class="sm">原扉页下缘</text><path d="M385 1050L675 1050" class="line"/><text x="403" y="1080" class="sm">图版身份</text><ellipse cx="476.05" cy="1139.0" rx="58.8" ry="39.2" class="line"/><rect x="534.85" y="1111.0" width="41.650000000000006" height="70.0" class="line"/><rect x="429.5" y="1185.2" width="105.35" height="32.2" class="line"/><rect x="556.9" y="1178.2" width="68.60000000000001" height="35.0" class="line"/><text x="725" y="948" class="">逛图版</text><rect x="725" y="970" width="290" height="285" class="line"/><ellipse cx="816.08" cy="1061.75" rx="60.48" ry="57.400000000000006" class="line"/><rect x="876.56" y="1020.75" width="42.84" height="102.5" class="line"/><rect x="768.2" y="1129.4" width="108.36" height="47.15" class="line"/><rect x="899.24" y="1119.15" width="70.56" height="51.25" class="line"/><text x="743" y="1232" class="sm">编号直达本页案例</text><text x="1065" y="948" class="">读案例 / 回到裁片</text><rect x="1065" y="970" width="290" height="285" class="line"/><rect x="1083" y="990" width="254" height="120" class="line"/><text x="1083" y="1143" class="sm">同页完整解读</text><text x="1083" y="1175" class="sm">作品全集 → 沉浸大图</text><text x="1083" y="1210" class="sm">关闭后回原阅读位置</text><text x="45" y="1303" class="">验收重点：保住原开场；拼贴能早看、能细看；不重复解释；返回不丢位置。</text><text x="45" y="1340" class="sm">A/B均为研究候选。拼贴在手机本来就超过一屏，示意框不代表强行压缩进一屏。</text></svg>