<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100"><rect width="1100" height="1100" fill="white"/><style>text{font-family:"PingFang SC",sans-serif;font-size:20px;fill:black}.h{font-size:30px;font-weight:600}rect,path{stroke:black;stroke-width:1.5;fill:none}</style><text x="42" y="50" class="h">结构候选：完整图版，作为章节中的一次展开</text><text x="42" y="90">只讨论顺序与停顿；已有拼贴视为不可拆分的完整单元。</text><text x="42" y="150" class="h">手机 / 一条连续阅读路径</text><rect x="42" y="180" width="350" height="170"/><text x="62" y="222">吊灯扉页（待定稿）</text><text x="62" y="264">白色装饰、词条名、封面作品</text><text x="62" y="305">重复核心句可从这一段精简</text><path d="M217 350v30m-6-6 6 6 6-6"/><rect x="42" y="380" width="350" height="110"/><text x="62" y="422">现有正文引入</text><text x="62" y="460">短阅读段；不另加装饰</text><path d="M217 490v30m-6-6 6 6 6-6"/><rect x="42" y="520" width="350" height="300"/><text x="62" y="568">完整拼贴 / 13c7d07</text><text x="62" y="614">原标题、原裁片、原编号</text><text x="62" y="654">原色、原留白、原收尾</text><text x="62" y="714">整块保留，不抽图跨界</text><text x="62" y="780">此处压缩示意实际长度</text><path d="M217 820v30m-6-6 6 6 6-6"/><rect x="42" y="850" width="350" height="110"/><text x="62" y="893">纸色正文 / 案例分析</text><text x="62" y="933">接续真实内容，不再重复核心句</text><text x="466" y="150" class="h">桌面 / 图版横向展开</text><rect x="466" y="180" width="590" height="90"/><text x="490" y="232">吊灯扉页：沿用室内开场</text><rect x="466" y="290" width="590" height="90"/><text x="490" y="342">短正文：沿阅读列进入</text><rect x="466" y="400" width="590" height="280"/><text x="490" y="445">完整桌面拼贴，按原比例展示</text><text x="490" y="490">图版比正文列更宽，形成展开感</text><text x="490" y="535">不包成小卡片，不补花边或新阴影</text><text x="490" y="635">已有白底本身承担纸页边界</text><rect x="466" y="700" width="590" height="90"/><text x="490" y="752">回到正文列，细读作品</text><text x="466" y="855">镜头节奏：装饰密 → 阅读静 → 图版展开 → 细读</text><text x="466" y="900">自然滚动先成立，再研究是否需要动效。</text><text x="466" y="945">拼贴不改；这一稿不是美术或交互定稿。</text><text x="42" y="1040">检验点：两段是否像同一章节？中间短文是否有必要？首屏是否过长？</text></svg>