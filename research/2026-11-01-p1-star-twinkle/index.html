<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>P1 星星明灭 · 独立预览</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:#e8e5de;color:#26231e;font:14px system-ui}main{max-width:1060px;margin:auto;padding:20px}h1{font:22px Georgia,serif;margin:0 0 8px}p{margin:8px 0 14px;color:#656058}button{font:inherit;border:1px solid #b7afa1;background:#f7f4ec;color:inherit;padding:8px 12px;cursor:pointer;margin:0 6px 7px 0}button.active{background:#26231e;color:#f7f4ec}.layout{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}.phone-shell{position:relative;flex:none;background:#f7f4ec;box-shadow:0 5px 24px #0001}.phone{position:absolute;top:0;left:0;width:390px;height:844px;transform-origin:top left}iframe{width:100%;height:100%;border:0;display:block}.detail{width:300px}svg.sample{background:#f7f4ec;width:140px;height:140px;display:inline-block;border:1px solid #d8d1c6}.labels{display:flex;justify-content:space-around;font-size:12px;margin-top:8px}.status{font-size:12px;min-height:28px;line-height:1.8}.note{font-size:12px;line-height:1.8}#verification{white-space:pre-wrap;font:12px ui-monospace,monospace;color:#655f54}@media(max-width:500px){main{padding:12px}.layout{gap:20px}}
</style><main><div id="preview-head"><h1>P1 · 星星明灭</h1><p>出现 → 完全消失 → 再出现。滑动时继续，离开视野才暂停。</p><button id="play" class="active">播放明灭</button><button id="still">原版静止</button><button id="hidden">完全消失帧</button><button id="restart">重播开场</button><button id="size">原尺寸查看</button><div class="status" id="status">等待开场显影…</div></div><div class="layout" id="layout"><div class="phone-shell" id="shell"><div class="phone" id="phone-wrap"><iframe id="phone" title="P1 手机星星明灭候选"></iframe></div></div><div class="detail"><p>两帧对照</p><div id="samples"></div><div class="labels"><span>出现</span><span>完全消失</span></div><p class="note">完整画面已缩放到当前窗口，方便直接看星星。也可切换原尺寸，边滑动边看。</p><p class="note">采用版本 · 当前合入效果预览。</p><output id="verification" hidden></output></div></div></main>
<script>
const phone=document.getElementById('phone'),status=document.getElementById('status');
const shell=document.getElementById('shell'),wrap=document.getElementById('phone-wrap');
const source='../../deploy/netlify-p1p3-continuous-2026-10-31/';
const shape='M145 1155L182 1190 199 1227 183 1265 145 1290 106 1265 91 1227 106 1189Z';
let mode='play',animation=null,svg=null,base=null,marker=null,poller=null,visible=false,fit=true,cleanup=()=>{};
function fitPreview(){
 const padding=innerWidth<=500?24:40;
 const available=Math.max(180,innerHeight-document.getElementById('layout').getBoundingClientRect().top-20);
 const scale=fit?Math.min(1,(innerWidth-padding)/390,available/844):Math.min(1,(innerWidth-padding)/390);
 wrap.style.transform=`scale(${scale})`;shell.style.width=390*scale+'px';shell.style.height=844*scale+'px';
 requestAnimationFrame(checkVisibility);
}
function checkVisibility(){
 if(!marker)return;
 const r=marker.getBoundingClientRect(),frame=phone.getBoundingClientRect(),k=frame.height/phone.clientHeight;
 const top=frame.top+r.top*k,bottom=frame.top+r.bottom*k;
 const next=r.bottom>0&&r.top<phone.contentWindow.innerHeight&&bottom>0&&top<innerHeight&&!document.hidden;
 if(next!==visible){visible=next;apply();}
}
function apply(){
 if(!svg||!animation)return;
 const reduced=phone.contentWindow.matchMedia('(prefers-reduced-motion:reduce)').matches;
 svg.style.display=mode==='still'||reduced?'none':'';
 if(mode==='hidden'&&!reduced){animation.pause();animation.currentTime=1900;status.textContent='完全消失帧 · 星星透明度 0';}
 else if(mode==='play'&&!reduced){
  if(visible){animation.play();status.textContent='播放中 · 出现 → 完全消失 → 再出现，滑动时继续';}
  else{animation.pause();status.textContent='星星暂时在视野外，滑到它时继续闪烁';}
 }else{animation.pause();status.textContent=reduced?'减少动态效果：显示原图':'原版静止';}
 document.getElementById('play').classList.toggle('active',mode==='play');document.getElementById('still').classList.toggle('active',mode==='still');document.getElementById('hidden').classList.toggle('active',mode==='hidden');
 phone.contentDocument.documentElement.dataset.twinkleVisible=String(visible);
 phone.contentDocument.documentElement.dataset.twinkleMode=mode;
}
function install(){
 const doc=phone.contentDocument;svg=doc.querySelector('.mobile-star-blink');base=doc.querySelector('#mp1');marker=doc.querySelector('[data-blink-marker]');
 animation=svg?.querySelector('[data-blink-star]')?.getAnimations()[0];
 if(!animation||!marker)return;
 visible=false;
 const win=phone.contentWindow,reduced=win.matchMedia('(prefers-reduced-motion:reduce)');
 const afterScroll=()=>win.requestAnimationFrame(()=>win.requestAnimationFrame(checkVisibility));
 win.addEventListener('scroll',afterScroll,{passive:true});reduced.addEventListener('change',apply);
 cleanup=()=>{win.removeEventListener('scroll',afterScroll);reduced.removeEventListener('change',apply);};
 checkVisibility();apply();
}

function boot(){
 cleanup();clearInterval(poller);animation=null;svg=null;base=null;marker=null;visible=false;status.textContent='等待开场显影…';
 phone.onload=()=>{poller=setInterval(()=>{const s=phone.contentDocument.querySelector('#mp1-scene');if(s&&s.querySelector('#mp1').naturalWidth&&phone.contentWindow.matchMedia('(prefers-reduced-motion:reduce)').matches){clearInterval(poller);status.textContent='减少动态效果：显示原图';return;}if(s&&s.querySelector('#mp1').naturalWidth&&phone.contentDocument.querySelector('.mobile-star-blink')){clearInterval(poller);install();}},40);};
 phone.src=source+'?star-preview=blink-v2-'+Date.now();fitPreview();
}
document.getElementById('play').onclick=()=>{mode='play';apply()};document.getElementById('still').onclick=()=>{mode='still';apply()};document.getElementById('hidden').onclick=()=>{mode='hidden';apply()};document.getElementById('restart').onclick=boot;
document.getElementById('size').onclick=()=>{fit=!fit;document.getElementById('size').textContent=fit?'原尺寸查看':'完整画面查看';fitPreview()};
addEventListener('resize',fitPreview);addEventListener('scroll',checkVisibility,{passive:true});document.addEventListener('visibilitychange',checkVisibility);
const art=source+'p3-stained-glass-v3-2026-10-23/assets/m_p1_notext_original_v20261101.png';
for(const [i,opacity] of [1,0].entries())document.getElementById('samples').insertAdjacentHTML('beforeend',`<svg class="sample" viewBox="76 1158 139 138" aria-label="星星${i?'完全消失':'出现'}"><defs><clipPath id="sample-clip-${i}"><path d="${shape}"/></clipPath></defs><image href="${art}" width="780" height="1688"/><path d="${shape}" fill="#faf7f1"/><g clip-path="url(#sample-clip-${i})" opacity="${opacity}"><image href="${art}" width="780" height="1688"/></g></svg>`);
boot();
</script></html>
