</style><main><div id="head"><h1>P1 · 泪滴显现一次</h1><p>人物显影完成后，泪滴渐渐出现。之后保留，滚动回来也不重播。</p><button id="replay">重播这一次开场</button><div id="state">正在载入…</div></div><div class="row" id="row"><div class="shell" id="shell"><div class="device" id="device"><iframe id="scene" title="手机 P1 泪滴显现一次"></iframe></div></div><div class="detail"><p>同步眼部局部</p><svg id="zoom" viewBox="490 875 100 85" aria-label="原眼部与泪滴的显现过程"><defs><filter id="zoom-skin-edge" x="-50%" y="-50%" width="200%" height="200%"><feMorphology operator="dilate" radius=".8"/><feGaussianBlur stdDeviation=".85"/></filter><mask id="zoom-skin-soft" maskUnits="userSpaceOnUse" x="532" y="900" width="21" height="22"><path id="zoom-soft-path" fill="white" filter="url(#zoom-skin-edge)"/></mask><linearGradient id="zoom-skin" gradientUnits="userSpaceOnUse" x1="537" y1="903" x2="547" y2="918"><stop stop-color="#f6f2ed"/><stop offset="1" stop-color="#f4f0ea"/></linearGradient><clipPath id="zoom-shape"><path id="zoom-shape-path"/></clipPath><clipPath id="zoom-wipe"><rect id="zoom-wipe-rect" x="534" y="902" width="17" height="0"/></clipPath></defs><image class="art" width="780" height="1688"/><g id="zoom-cover" mask="url(#zoom-skin-soft)"><image class="art" width="780" height="1688" transform="matrix(2 0 0 1 -560 0)"/></g><g clip-path="url(#zoom-shape)"><g clip-path="url(#zoom-wipe)"><g id="zoom-tear" opacity="0"><image class="art" width="780" height="1688"/></g></g></g></svg><p class="note">泪滴沿用原图，只有一次从无到有。现有星星明灭保持原样。</p><p class="note">独立预览，尚未替换线上。</p></div></div></main><script>
const frame=document.getElementById('scene'),status=document.getElementById('state'),device=document.getElementById('device'),shell=document.getElementById('shell');
const shape='M539.3 904.8C542.2 903.3 546.9 905.3 547.5 908.8C548.2 913.5 545.7 916.5 541.6 916.3C538.2 916.1 536.5 913.7 536.7 910.7C536.9 908.1 538.0 906.3 539.3 904.8Z';
for(const id of ['zoom-soft-path','zoom-shape-path'])document.getElementById(id).setAttribute('d',shape);
const art='../../deploy/netlify-p1p3-continuous-2026-10-31/p3-stained-glass-v3-2026-10-23/assets/m_p1_notext_original_v20261101.png';document.querySelectorAll('.art').forEach(el=>el.setAttribute('href',art));
let raf=0,last='';
function fit(){const available=Math.max(180,innerHeight-document.getElementById('row').getBoundingClientRect().top-18),scale=Math.min(1,(innerWidth-(innerWidth<500?24:40))/390,available/844);device.style.transform=`scale(${scale})`;shell.style.width=390*scale+'px';shell.style.height=844*scale+'px'}
function update(){
 const doc=frame.contentDocument,s=doc?.querySelector('#mp1-scene'),phase=s?.dataset.tearOnce||'waiting';
 const tear=doc?.querySelector('[data-tear]'),rect=doc?.querySelector('[data-tear-wipe]');
 const finished=phase==='done'||phase==='static';document.getElementById('zoom-cover').style.display=finished?'none':'';
 document.getElementById('zoom-tear').setAttribute('opacity',tear?frame.contentWindow.getComputedStyle(tear).opacity:'0');
 document.getElementById('zoom-wipe-rect').setAttribute('height',rect?parseFloat(frame.contentWindow.getComputedStyle(rect).height)||0:0);
 const text=phase==='done'?'已显现 · 本次只播放一次':phase==='revealing'?'泪滴正在显现…':phase==='static'?'减少动态效果：直接保留原图':'人物显影中，泪滴尚未出现';if(text!==last){status.textContent=text;last=text}
 if(phase!=='done'&&phase!=='static')raf=requestAnimationFrame(update);
}
function boot(){cancelAnimationFrame(raf);last='';status.textContent='正在载入…';document.getElementById('zoom-cover').style.display='';document.getElementById('zoom-tear').setAttribute('opacity','0');frame.onload=()=>{fit();update()};frame.src='scene.html?tear-review='+Date.now();fit()}
document.getElementById('replay').onclick=boot;addEventListener('resize',fit);boot();
</script></html>
