<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1392" height="1140" viewBox="0 0 1392 1140"><rect width="100%" height="100%" fill="white"/><g font-family="Songti SC, Noto Serif CJK SC, serif"><text x="48" y="48" font-size="30" fill="#111" text-anchor="start">桌面取景 / 门后的书写台，只取一个局部</text><text x="48" y="81" font-size="16" fill="#111" text-anchor="start">同一器物重新构图：桌面可见结构侧面；手机抬高纸面、裁掉两侧；文字不跟随透视倾斜。</text><g transform="translate(48 115) scale(.9)"><rect width="1440" height="1000" fill="white"/><path d="M40 24 L43 42 L54 44 L43 47 L40 63 L37 47 L26 44 L37 42 Z" fill="none" stroke="#111" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="49" font-size="11" fill="#111" text-anchor="start">导航</text><text x="116" y="208" font-size="16" fill="#111" text-anchor="start">意象实验室</text><text x="116" y="271" font-size="45" fill="#111" text-anchor="start">文字，发生关系。</text><text x="116" y="322" font-size="19" fill="#111" text-anchor="start">把不相关的事物放在一起。</text><path d="M560 320 L1260 320 L1430 660 L460 660 Z M460 660 L1430 660 L1430 682 L460 682 Z M460 696 L1430 696" fill="none" stroke="#111" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M505 696 L505 1000 M535 696 L535 1000 M1330 696 L1330 1000 M1360 696 L1360 1000 M535 850 Q540 743 643 708 Q742 743 747 850 M550 850 Q554 758 643 724 Q729 758 732 850 M1110 850 Q1114 743 1217 708 Q1320 743 1330 850" fill="none" stroke="#111" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><path d="M645 345 L1165 345 L1250 624 L571 624 Z M580 635 L1262 635" fill="none" stroke="#111" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M1217 248 L1217 296 Q1193 328 1210 350 Q1231 366 1251 350 Q1264 328 1244 296 L1244 248 Z M1228 339 Q1257 237 1220 190 Q1204 169 1218 151 M1220 190 Q1261 189 1262 164 Q1230 161 1220 190" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="735" y="445" font-size="48" fill="#111" text-anchor="start">时钟</text><text x="914" y="464" font-size="28" fill="#111" text-anchor="start">＋</text><text x="1020" y="495" font-size="48" fill="#111" text-anchor="start">发芽</text><text x="884" y="540" font-size="15" fill="#111" text-anchor="start">点词可改</text><text x="879" y="591" font-size="24" fill="#111" text-anchor="start">试一次 →</text><text x="116" y="486" font-size="25" fill="#111" text-anchor="start">相遇 ＋</text><path d="M116 500 L207 500" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="156" y="575" font-size="25" fill="#111" text-anchor="start">抽离 −</text><text x="126" y="668" font-size="25" fill="#111" text-anchor="start">替换 →</text><text x="116" y="875" font-size="16" fill="#111" text-anchor="start">← 艺术资源</text><text x="116" y="914" font-size="15" fill="#111" text-anchor="start">继续探索，可打开左上角星星。</text></g><text x="48" y="1055" font-size="18" fill="#111" text-anchor="start">滚动衔接：P5 门脚离开 → 短留白 → P6 标题与桌面进入。门不被点击、不变形，也不强制穿门。</text><text x="48" y="1090" font-size="18" fill="#111" text-anchor="start">跨屏同时可见门脚和台沿时，以取景、线密度和尖拱结构接续；星星始终留在同一界面位置。</text></g></svg>