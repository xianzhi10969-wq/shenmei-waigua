<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯下图页 · 结构检验</title><style>*{box-sizing:border-box}body{margin:0;background:white;color:black;font-family:system-ui}header{padding:24px 30px;border-bottom:1px solid black}h1{font-size:24px;margin:0 0 8px}p{font-size:14px;line-height:1.7;margin:0}main{padding:26px 30px;display:grid;grid-template-columns:390px minmax(0,1fr);gap:44px;max-width:1440px;margin:auto}h2{font-size:18px;margin:0 0 12px}img{display:block;width:100%;border:1px solid black}figcaption{font-size:13px;line-height:1.8;margin-top:14px}figure{margin:0}a{color:black}.desktop{margin-bottom:28px}.note{margin-top:24px;padding-top:20px;border-top:1px solid black}.note p{margin-bottom:10px}@media(max-width:850px){main{display:block;padding:22px 18px}figure{max-width:390px;margin:0 auto 32px}.right figure{max-width:none}header{padding:20px 18px}}</style><header><h1>让吊灯与图版共处一幅画面</h1><p>黑线结构草图 · 吊灯线条只是结构占位，矩形与椭圆代表原拼贴图像，均非新美术。</p></header><main><figure><h2>手机 / 原拼贴保持 100%</h2><img src="mobile.svg" alt="手机首屏结构，标题与作品原位置，吊灯从右上角进入留白"><figcaption>拼贴从页面顶端开始；没有前奏、展开按钮或顶部横条。右上方仅保留能避开标题和作品的灯臂与垂饰。<br><a href="mobile-full.svg">看完整手机结构 ↗</a></figcaption></figure><section class="right"><figure class="desktop"><h2>桌面 / 完整图页与右侧吊灯</h2><img src="desktop.svg" alt="桌面结构，完整图版在左，较大的吊灯位于右侧环境"><figcaption>原图版整体等比显示为82%，内部位置不变；右侧让出足够的环境空间。<br><a href="desktop-full.svg">看完整桌面结构 ↗</a></figcaption></figure><div class="note"><p><strong>结构检查结果</strong><br>手机标题仍为88px，作品不缩小；桌面标题约108px。用原吊灯透明区域与真实文字、图像、编号范围核对，两端均未发现遮挡。</p><p><strong>仍需审图的取舍</strong><br>手机只能保留侧切的局部，不能同时看到大半盏灯。草图证明能摆下，不能证明白色吊灯的美感已经保住。</p><p>本轮只检查构图，未试黑白底色，也未修改定稿拼贴或Figma。没有用新的完整美术掩盖结构问题。</p></div></section></main></html>
