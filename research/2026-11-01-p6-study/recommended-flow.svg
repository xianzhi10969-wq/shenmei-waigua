<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1120" viewBox="0 0 1460 1120"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Songti SC, Noto Serif SC, serif"><text x="45" y="62" font-size="32" text-anchor="start" class="">A · P5 → P6：从找到参考，到亲手试一次</text><text x="45" y="101" font-size="16" text-anchor="start" class="">同纸自然下滑；互动状态原位保留。以下只比较结构与阅读顺序。</text><text x="45" y="157" font-size="21" text-anchor="start" class="">手机 / 默认操作</text><g transform="translate(45,183)"><rect width="390" height="844" fill="white" stroke="black"/><text x="28" y="43" font-size="27" text-anchor="start" class="">✦</text><text x="64" y="40" font-size="12" text-anchor="start" class="">导航</text><text x="362" y="40" font-size="12" text-anchor="end" class="">意象实验室</text><text x="28" y="135" font-size="32" text-anchor="start" class="">文字</text><text x="28" y="176" font-size="32" text-anchor="start" class="">发生关系。</text><text x="28" y="216" font-size="14" text-anchor="start" class="">让熟悉的词，试一种新的关系。</text><path d="M54 409 Q166 302 326 429 M84 330 Q180 449 309 466" fill="none" stroke="black" stroke-width="1"/><text x="86" y="345" font-size="28" text-anchor="start" class="">时钟</text><text x="195" y="404" font-size="24" text-anchor="middle" class="">＋</text><text x="272" y="464" font-size="28" text-anchor="middle" class="">发芽</text><text x="195" y="510" font-size="13" text-anchor="middle" class="">点词可改 · 换一组</text><text x="76" y="586" font-size="18" text-anchor="middle" class="">＋ 相遇</text><text x="195" y="586" font-size="18" text-anchor="middle" class="">－ 抽离</text><text x="314" y="586" font-size="18" text-anchor="middle" class="">→ 替换</text><circle cx="76" cy="603" r="2" fill="black"/><text x="195" y="644" font-size="14" text-anchor="middle" class="">把不相关的事物放在一起</text><text x="195" y="709" font-size="20" text-anchor="middle" class="">试一次  →</text><path d="M140 726L250 726" fill="none" stroke="black" stroke-width="1" /><text x="195" y="798" font-size="12" text-anchor="middle" class="">三个动作，一张可以反复试的纸。</text></g><text x="480" y="157" font-size="21" text-anchor="start" class="">手机 / 结果原位展开</text><g transform="translate(480,183)"><rect width="390" height="844" fill="white" stroke="black"/><text x="28" y="43" font-size="27" text-anchor="start" class="">✦</text><text x="64" y="40" font-size="12" text-anchor="start" class="">导航</text><text x="362" y="40" font-size="12" text-anchor="end" class="">意象实验室</text><text x="28" y="135" font-size="32" text-anchor="start" class="">文字</text><text x="28" y="176" font-size="32" text-anchor="start" class="">发生关系。</text><text x="28" y="216" font-size="14" text-anchor="start" class="">让熟悉的词，试一种新的关系。</text><text x="195" y="304" font-size="18" text-anchor="middle" class="">时钟  ＋  发芽</text><path d="M102 337Q195 371 288 337" fill="none" stroke="black"/><text x="195" y="431" font-size="25" text-anchor="middle" class="">如果时间也会生长，</text><text x="195" y="473" font-size="25" text-anchor="middle" class="">我们该怎样等待？</text><text x="116" y="596" font-size="18" text-anchor="middle" class="">再试一次</text><text x="275" y="596" font-size="16" text-anchor="middle" class="">复制</text><text x="195" y="654" font-size="14" text-anchor="middle" class="">换一组词</text><text x="195" y="764" font-size="14" text-anchor="middle" class="">去好奇心漫游  →</text></g><text x="925" y="157" font-size="21" text-anchor="start" class="">桌面 / 两轴组织，实验区扩大</text><g transform="translate(925,183)"><rect width="490" height="330" fill="white" stroke="black"/><text x="20" y="31" font-size="13" text-anchor="start" class="">✦ 导航</text><text x="20" y="103" font-size="25" text-anchor="start" class="">文字</text><text x="20" y="138" font-size="25" text-anchor="start" class="">发生关系。</text><text x="20" y="172" font-size="11" text-anchor="start" class="">意象实验室</text><path d="M228 113Q340 70 451 213 M244 77Q335 242 436 237" fill="none" stroke="black"/><text x="243" y="104" font-size="24" text-anchor="start" class="">时钟</text><text x="339" y="165" font-size="20" text-anchor="start" class="">＋</text><text x="407" y="240" font-size="24" text-anchor="start" class="">发芽</text><text x="335" y="274" font-size="12" text-anchor="middle" class="">相遇　　抽离　　替换</text><text x="335" y="309" font-size="16" text-anchor="middle" class="">试一次 →</text></g><text x="925" y="557" font-size="22" text-anchor="start" class="">衔接三镜</text><text x="925" y="601" font-size="16" text-anchor="start" class="">01</text><text x="966" y="601" font-size="18" text-anchor="start" class="">P5半扇门随滚动离开</text><text x="966" y="632" font-size="13" text-anchor="start" class="">沿用现有页底“意象实验室”提示。</text><text x="925" y="702" font-size="16" text-anchor="start" class="">02</text><text x="966" y="702" font-size="18" text-anchor="start" class="">留一段纸面呼吸</text><text x="966" y="733" font-size="13" text-anchor="start" class="">同纸色、同星B；圆与弧只做形状呼应。</text><text x="925" y="803" font-size="16" text-anchor="start" class="">03</text><text x="966" y="803" font-size="18" text-anchor="start" class="">两个词成为新焦点</text><text x="966" y="834" font-size="13" text-anchor="start" class="">先见完整例子，再用一个动作开始。</text><text x="925" y="926" font-size="17" text-anchor="start" class="">星星只负责全站导航。</text><text x="925" y="956" font-size="14" text-anchor="start" class="">开关导航后，模式、词与结果不丢失。</text><text x="925" y="1010" font-size="13" text-anchor="start" class="">正式装饰独立研究，不在草图里伪装完成。</text><text x="45" y="1081" font-size="15" text-anchor="start" class="">注：示意✦仅标导航位置；正式稿复用星B原资产。新文案、字体与美术均未定稿。</text></g></svg>