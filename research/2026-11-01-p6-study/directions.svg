<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1150" viewBox="0 0 1460 1150"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Songti SC, Noto Serif SC, serif"><text x="50" y="65" font-size="34" text-anchor="start" class="">P6 · 三种结构方向</text><text x="50" y="106" font-size="16" text-anchor="start" class="">黑线白底结构讨论；非完成美术。词语与问题沿用旧 Figma 示例。</text><text x="50" y="156" font-size="22" text-anchor="start" class="">A / 纸上的意象试验 · 推荐</text><text x="50" y="187" font-size="14" text-anchor="start" class="">留白与词语成为中心</text><g transform="translate(50,218)"><rect width="390" height="844" fill="white" stroke="black"/><text x="28" y="43" font-size="27" text-anchor="start" class="">✦</text><text x="64" y="40" font-size="12" text-anchor="start" class="">导航</text><text x="362" y="40" font-size="12" text-anchor="end" class="">意象实验室</text><text x="28" y="135" font-size="32" text-anchor="start" class="">文字</text><text x="28" y="176" font-size="32" text-anchor="start" class="">发生关系。</text><text x="28" y="216" font-size="14" text-anchor="start" class="">让熟悉的词，试一种新的关系。</text><path d="M54 409 Q166 302 326 429 M84 330 Q180 449 309 466" fill="none" stroke="black" stroke-width="1"/><text x="86" y="345" font-size="28" text-anchor="start" class="">时钟</text><text x="195" y="404" font-size="24" text-anchor="middle" class="">＋</text><text x="272" y="464" font-size="28" text-anchor="middle" class="">发芽</text><text x="195" y="510" font-size="13" text-anchor="middle" class="">点词可改 · 换一组</text><text x="76" y="586" font-size="18" text-anchor="middle" class="">＋ 相遇</text><text x="195" y="586" font-size="18" text-anchor="middle" class="">－ 抽离</text><text x="314" y="586" font-size="18" text-anchor="middle" class="">→ 替换</text><circle cx="76" cy="603" r="2" fill="black"/><text x="195" y="644" font-size="14" text-anchor="middle" class="">把不相关的事物放在一起</text><text x="195" y="709" font-size="20" text-anchor="middle" class="">试一次  →</text><path d="M140 726L250 726" fill="none" stroke="black" stroke-width="1" /><text x="195" y="798" font-size="12" text-anchor="middle" class="">三个动作，一张可以反复试的纸。</text></g><text x="50" y="1100" font-size="16" text-anchor="start" class="">衔接最自然；手机操作最直接。</text><text x="535" y="156" font-size="22" text-anchor="start" class="">B / 可转动的纸盘</text><text x="535" y="187" font-size="14" text-anchor="start" class="">借古书的可操纵插页</text><g transform="translate(535,218)"><rect width="390" height="844" fill="white" stroke="black"/><text x="28" y="43" font-size="27" text-anchor="start" class="">✦</text><text x="64" y="40" font-size="12" text-anchor="start" class="">导航</text><text x="362" y="40" font-size="12" text-anchor="end" class="">意象实验室</text><text x="28" y="135" font-size="32" text-anchor="start" class="">转一转，</text><text x="28" y="176" font-size="32" text-anchor="start" class="">词语相遇。</text><text x="28" y="216" font-size="14" text-anchor="start" class="">古书中可操作的纸面装置。</text><circle cx="195" cy="422" r="148" fill="none" stroke="black" stroke-width="1"/><circle cx="195" cy="422" r="121" fill="none" stroke="black" stroke-width="1"/><circle cx="195" cy="422" r="76" fill="none" stroke="black" stroke-width="1"/><text x="195" y="342" font-size="28" text-anchor="middle" class="">时钟</text><text x="195" y="431" font-size="28" text-anchor="middle" class="">＋</text><text x="195" y="514" font-size="28" text-anchor="middle" class="">发芽</text><text x="195" y="613" font-size="14" text-anchor="middle" class="">点按换词 / 拖转只是补充</text><text x="195" y="669" font-size="17" text-anchor="middle" class="">相遇　　抽离　　替换</text><text x="195" y="737" font-size="20" text-anchor="middle" class="">试一次  →</text></g><text x="535" y="1100" font-size="16" text-anchor="start" class="">装置感强；需防止占卜感与手势冲突。</text><text x="1020" y="156" font-size="22" text-anchor="start" class="">C / 折页拼接</text><text x="1020" y="187" font-size="14" text-anchor="start" class="">用纸面开合揭示结果</text><g transform="translate(1020,218)"><rect width="390" height="844" fill="white" stroke="black"/><text x="28" y="43" font-size="27" text-anchor="start" class="">✦</text><text x="64" y="40" font-size="12" text-anchor="start" class="">导航</text><text x="362" y="40" font-size="12" text-anchor="end" class="">意象实验室</text><text x="28" y="135" font-size="32" text-anchor="start" class="">展开另一种</text><text x="28" y="176" font-size="32" text-anchor="start" class="">可能。</text><text x="28" y="216" font-size="14" text-anchor="start" class="">拼接两段纸面，再揭开结果。</text><path d="M48 300L325 300L341 315L341 536L65 536L48 521Z M48 412H341 M65 300V536" fill="none" stroke="black"/><text x="195" y="370" font-size="28" text-anchor="middle" class="">时钟</text><text x="195" y="428" font-size="25" text-anchor="middle" class="">＋</text><text x="195" y="494" font-size="28" text-anchor="middle" class="">发芽</text><text x="195" y="602" font-size="17" text-anchor="middle" class="">相遇　　抽离　　替换</text><text x="195" y="677" font-size="20" text-anchor="middle" class="">揭开  →</text><text x="195" y="745" font-size="14" text-anchor="middle" class="">换一条纸带 · 点词可改</text></g><text x="1020" y="1100" font-size="16" text-anchor="start" class="">接近书册语言；要避免重复 P4。</text></g></svg>