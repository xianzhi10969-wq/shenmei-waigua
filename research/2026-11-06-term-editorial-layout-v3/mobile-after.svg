<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1076" viewBox="0 0 390 1076"><style>@font-face{font-family:Display;src:url(assets/fonts/758883b3b8e23791.woff2);font-style:italic;font-weight:500}@font-face{font-family:Copy;src:url(assets/fonts/IntroCN.woff2)}text{fill:#000} .guide{fill:none;stroke:#000;stroke-width:1}.label{font:12px sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect class="guide" x="64" y="12" width="326" height="450"/><text class="label" x="156" y="230">既有吊灯 · 位置不变</text><text data-copy="Coquette" x="44" y="576" font-family="Display" font-size="84" font-style="italic" font-weight="500" letter-spacing="-.035em"><tspan x="44" dy="0">Coquette</tspan></text><text data-copy="镜前的人把缎带系好，又故意留下一截没收齐的带尾。" x="44" y="637" font-family="Copy" font-size="21"><tspan x="44" dy="0">镜前的人把缎带系好，又故意留</tspan><tspan x="44" dy="32">下一截没收齐的带尾。</tspan></text><text data-copy="你看得出她为被看见做了准备，却不能确定她想让谁看。做 Coquette 若只把蝴蝶结、蕾丝和粉色往上堆，调情会变成商品标签，人物反倒没了心思。" x="68" y="720" font-family="Copy" font-size="16"><tspan x="68" dy="0">你看得出她为被看见做了准备，却不能</tspan><tspan x="68" dy="28">确定她想让谁看。做 Coquette 若只把蝴</tspan><tspan x="68" dy="28">蝶结、蕾丝和粉色往上堆，调情会变成</tspan><tspan x="68" dy="28">商品标签，人物反倒没了心思。</tspan></text><path class="guide" d="M0 888H390"/><rect class="guide" x="22" y="920" width="346" height="124"/><text class="label" x="100" y="982">原完整拼贴 · 不改内部</text></svg>