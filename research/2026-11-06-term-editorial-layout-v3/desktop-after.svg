<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="924" viewBox="0 0 1440 924"><style>@font-face{font-family:Display;src:url(assets/fonts/758883b3b8e23791.woff2);font-style:italic;font-weight:500}@font-face{font-family:Copy;src:url(assets/fonts/IntroCN.woff2)}text{fill:#000} .guide{fill:none;stroke:#000;stroke-width:1}.label{font:12px sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect class="guide" x="850" y="0" width="570" height="633"/><text class="label" x="1030" y="180">既有吊灯 · 位置不变</text><text data-copy="Coquette" x="164" y="324" font-family="Display" font-size="104" font-style="italic" font-weight="500" letter-spacing="-.035em"><tspan x="164" dy="0">Coquette</tspan></text><text data-copy="镜前的人把缎带系好，又故意留下一截没收齐的带尾。" x="164" y="384" font-family="Copy" font-size="24"><tspan x="164" dy="0">镜前的人把缎带系好，又故意留下一截没收齐的带尾。</tspan></text><text data-copy="你看得出她为被看见做了准备，却不能确定她想让谁看。做 Coquette 若只把蝴蝶结、蕾丝和粉色往上堆，调情会变成商品标签，人物反倒没了心思。" x="220" y="452" font-family="Copy" font-size="20"><tspan x="220" dy="0">你看得出她为被看见做了准备，却不能确定她想让谁看。做 C</tspan><tspan x="220" dy="32">oquette 若只把蝴蝶结、蕾丝和粉色往上堆，调情会变成商品</tspan><tspan x="220" dy="32">标签，人物反倒没了心思。</tspan></text><path class="guide" d="M0 720H1440"/><rect class="guide" x="60" y="752" width="1320" height="140"/><text class="label" x="640" y="820">原完整拼贴 · 不改内部</text></svg>