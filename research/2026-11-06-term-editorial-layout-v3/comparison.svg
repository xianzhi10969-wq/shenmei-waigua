<svg xmlns="http://www.w3.org/2000/svg" width="860" height="690"><rect width="860" height="690" fill="white"/><text x="44" y="28" font-family="sans-serif" font-size="16">上一版</text><text x="474" y="28" font-family="sans-serif" font-size="16">新排版结构</text><svg x="20" y="50" width="390" height="630" viewBox="0 460 390 630"><style>@font-face{font-family:Display;src:url(assets/fonts/758883b3b8e23791.woff2);font-style:italic;font-weight:500}@font-face{font-family:Copy;src:url(assets/fonts/IntroCN.woff2)}text{fill:#000} .guide{fill:none;stroke:#000;stroke-width:1}.label{font:12px sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect class="guide" x="64" y="12" width="326" height="450"/><text class="label" x="156" y="230">既有吊灯 · 位置不变</text><text data-copy="Coquette" x="44" y="564" font-family="Display" font-size="72" font-style="italic" font-weight="500" letter-spacing="-.035em"><tspan x="44" dy="0">Coquette</tspan></text><text data-copy="镜前的人把缎带系好，又故意留下一截没收齐的带尾。你看得出她为被看见做了准备，却不能确定她想让谁看。做 Coquette 若只把蝴蝶结、蕾丝和粉色往上堆，调情会变成商品标签，人物反倒没了心思。" x="44" y="619" font-family="Copy" font-size="18"><tspan x="44" dy="0">镜前的人把缎带系好，又故意留下一</tspan><tspan x="44" dy="31">截没收齐的带尾。你看得出她为被看</tspan><tspan x="44" dy="31">见做了准备，却不能确定她想让谁</tspan><tspan x="44" dy="31">看。做 Coquette 若只把蝴蝶结、蕾丝和</tspan><tspan x="44" dy="31">粉色往上堆，调情会变成商品标签，</tspan><tspan x="44" dy="31">人物反倒没了心思。</tspan></text><path class="guide" d="M0 866H390"/><rect class="guide" x="22" y="898" width="346" height="124"/><text class="label" x="100" y="960">原完整拼贴 · 不改内部</text></svg><svg x="450" y="50" width="390" height="630" viewBox="0 460 390 630"><style>@font-face{font-family:Display;src:url(assets/fonts/758883b3b8e23791.woff2);font-style:italic;font-weight:500}@font-face{font-family:Copy;src:url(assets/fonts/IntroCN.woff2)}text{fill:#000} .guide{fill:none;stroke:#000;stroke-width:1}.label{font:12px sans-serif}</style><rect width="100%" height="100%" fill="white"/><rect class="guide" x="64" y="12" width="326" height="450"/>