<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>P6 第一层定位稿</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:"PingFang SC",sans-serif}.board{width:850px;padding:32px 40px}header{margin-bottom:24px}h1{font-size:23px;font-weight:500;margin:0 0 8px}header p{font-size:13px;margin:0}.row{display:flex;gap:38px;align-items:start}.art{width:392px;height:846px;border:1px solid #111;flex-shrink:0}object{width:390px;height:844px;display:block}aside{padding-top:125px;width:280px}h2{font-size:17px;font-weight:500;margin:0 0 10px}p{font-size:14px;line-height:1.9;margin:0}.note{margin-bottom:34px}.note:nth-child(2){margin-top:45px}.note:nth-child(3){margin-top:35px}.small{font-size:12px;margin-top:34px}button{border:1px solid #111;background:white;font:inherit;font-size:12px;padding:7px 10px;cursor:pointer;margin:5px 4px 0 0}button[aria-pressed=false]{text-decoration:line-through}footer{font-size:12px;margin-top:18px}</style><div class="board"><header><h1>P6 / 第一层 · 构图定位</h1><p>手机比例 390 × 844 · 只看占位与留白 · 轮廓尚未细画</p></header><div class="row"><div class="art"><object id="art" type="image/svg+xml" data="composition.svg"></object></div><aside><div class="note"><h2>01　衣袖从右侧进入</h2><p>头与身体留在画外。<br>衣袖先带出一个向左下的动作。</p></div><div class="note"><h2>02　手落在纸的上沿</h2><p>手与袖口相连。<br>这一层只标动作位置。</p></div><div class="note"><h2>03　纸向左下展开</h2><p>纸面是主要空区。<br>文字与操作下一层再安排。</p></div><p class="small">图层可分别开关：</p><div id="controls"><button data-layer="sleeve-placeholder" aria-pressed="true">衣袖</button><button data-layer="hand-placeholder" aria-pressed="true">手</button><button data-layer="paper-placeholder" aria-pressed="true">纸</button></div></aside></div><footer>画布外框仅表示屏幕边界，不是页面装饰。此稿待审，P1–P5 保持原样。</footer></div><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=document.getElementById('art').contentDocument.getElementById(b.dataset.layer);const show=b.getAttribute('aria-pressed')!=='true';n.style.display=show?'':'none';b.setAttribute('aria-pressed',String(show))});</script></html>
