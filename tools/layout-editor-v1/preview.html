<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>布局预览 · 排版工作室</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0ec;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#344137}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;background:#fff;border-bottom:1px solid #dfe5de;padding:14px 24px}header strong{font-weight:600}header span{color:#899489;font-size:11px}select,button,a{font:inherit;color:inherit;background:#fff;border:1px solid #dce3db;border-radius:5px;padding:6px 10px;text-decoration:none}a{margin-left:auto}main{padding:32px;min-height:calc(100vh - 60px)}#frame{margin:auto;position:relative}#art{transform-origin:top left;box-shadow:0 2px 16px #23331d12}#error{color:#915e30} @media(max-width:600px){header{padding:10px;gap:8px;flex-wrap:wrap}header span{display:none}main{padding:16px}}
</style></head><body><header><strong>布局预览</strong><select id="page" aria-label="预览场景"></select><select id="mode" aria-label="预览设备"><option value="desktop">桌面</option><option value="mobile">手机</option></select><span id="status">与编辑器共用布局 · 自动同步</span><a href="/">返回编辑器</a></header><main><p id="error" hidden></p><div id="frame"><div id="art"></div></div></main><script type="module">
import {renderLayout} from './renderer.js';
const q=new URLSearchParams(location.search);let selected=q.get('page'),mode=q.get('mode')==='mobile'?'mobile':'desktop',doc,revision=-1;
const pageSelect=document.getElementById('page'),modeSelect=document.getElementById('mode');modeSelect.value=mode;
function draw(){if(!doc)return;const page=doc.pages.find(p=>p.id===selected)||doc.pages[0];selected=page.id;pageSelect.value=selected;const l=page.layouts[mode],padding=innerWidth<600?32:64,scale=Math.min(1,(innerWidth-padding)/l.width);renderLayout(document.getElementById('art'),l,doc.assets);document.getElementById('art').style.transform=`scale(${scale})`;Object.assign(document.getElementById('frame').style,{width:l.width*scale+'px',height:l.height*scale+'px'});}
async function refresh(){try{const response=await fetch('/api/state');if(!response.ok)throw new Error();const state=await response.json();document.getElementById('error').hidden=true;if(state.revision===revision)return;doc=state.document;revision=state.revision;pageSelect.replaceChildren();for(const p of doc.pages){const option=document.createElement('option');option.value=p.id;option.textContent=p.name;pageSelect.append(option);}draw();}catch{const error=document.getElementById('error');error.hidden=false;error.textContent='本地服务未连接，暂时无法更新预览。';}}
pageSelect.onchange=()=>{selected=pageSelect.value;draw();};modeSelect.onchange=()=>{mode=modeSelect.value;draw();};window.onresize=draw;await refresh();setInterval(refresh,2000);
</script></body></html>
