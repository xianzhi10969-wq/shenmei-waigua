<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><rect width="1080" height="660" fill="white"/><style>text{font-family:Arial,"Songti SC",serif;fill:black}.frame{fill:none;stroke:black;stroke-width:1}.small{font-size:15px}.title{font-size:20px}</style><text x="32" y="35" class="title">候选：共享一个画幅，滚动完成暗场 → 纸白 → 图谱</text><g class="frame"><rect x="32" y="80" width="300" height="450"/><rect x="390" y="80" width="300" height="450"/><rect x="748" y="80" width="300" height="450"/><path d="M348 300h26m-7-7 7 7-7 7M706 300h26m-7-7 7 7-7 7"/></g><g class="small"><text x="56" y="112">01　先读完介绍</text><text x="414" y="112">02　整屏底色转换</text><text x="772" y="112">03　图谱成为阅读画面</text><text x="56" y="158">全屏深底 · 吊灯取景</text><text x="56" y="250" font-size="32">Coquette</text><text x="56" y="292">中文解释</text><text x="56" y="344">一段连贯的情境介绍</text><text x="56" y="474">文字离开视野后才接续</text><text x="428" y="255">暗场淡出 → 整屏纸白</text><text x="430" y="300">同一画幅，没有矩形卡片</text><text x="426" y="474">不计时等待 · 由滚动控制</text><text x="772" y="158" font-size="19">风格图谱</text><text x="772" y="474">图像显现后继续正常下滑</text><text x="32" y="574">保留：吊灯、中文解释、情境介绍、完整拼贴、正文与做法。</text><text x="32" y="606">本图只说明镜头接续；色彩转换节奏和作品显现方式尚未试做、未经确认。</text></g><g class="frame"><ellipse cx="852" cy="287" rx="62" ry="83"/><rect x="888" y="290" width="64" height="130"/><rect x="963" y="215" width="46" height="68"/><rect x="783" y="390" width="100" height="52"/><rect x="965" y="359" width="50" height="48"/></g></svg>