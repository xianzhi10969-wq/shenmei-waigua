<!doctype html><html lang="zh"><head><meta charset="utf-8">
<title>审美外挂 · P3 彩窗 v3（全量彩色封面 · 待夕里审）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:CabinetSong;src:url(assets/cabinet-song.ttf) format("truetype");font-display:block}
:root{--ink:#1E1E1E;--paper:#F6F3ED}
html,body{margin:0;background:var(--paper)} html{overflow-x:clip}
#desk{position:relative;width:1440px;margin:0 auto}
#p1{position:relative;width:1440px;height:900px;background:#f9f6ef}
#p1 .lay{position:absolute;left:0;top:64px;width:1440px;height:836px;opacity:0}
#text{position:absolute;left:0;top:0;width:1440px;height:900px;opacity:0;animation:fade 1.1s cubic-bezier(.22,.61,.36,1) .2s forwards}
#bg{animation:wipe 1.2s cubic-bezier(.22,.61,.36,1) 0s forwards}
#shrine{animation:wipe 1.0s cubic-bezier(.22,.61,.36,1) .7s forwards}
#woman{animation:wipe 1.1s cubic-bezier(.22,.61,.36,1) 1.2s forwards}
@keyframes fade{to{opacity:1}}
@keyframes wipe{from{opacity:0;clip-path:inset(0 0 18% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
#p2{display:block;width:1440px;height:811px}
#mob{display:none} #mob img{display:block;width:100%;height:auto}
body.m #desk{display:none} body.m #mob{display:block}
@media (max-width:899px){#desk{display:none}#mob{display:block}}
body.p3only #desk,body.p3only #mob{display:none}
#p3{position:relative;height:380vh}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--paper)}
.win-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;width:100%;height:100%;pointer-events:none;z-index:3}
.win-wrap img{display:block;height:min(90vh,1000px);width:auto;max-width:94vw;opacity:0;pointer-events:auto}
body.m .win-wrap img{height:min(86vh,820px)}
.win-wrap img.on{opacity:1}
.night{position:absolute;left:0;right:0;background:var(--ink);will-change:transform;z-index:2}
.sky{top:0}.water{bottom:0}
.wline{position:absolute;left:0;right:0;top:0;height:1px;background:var(--paper)}
#star{position:fixed;left:0;top:0;width:156px;height:156px;z-index:20;pointer-events:none;will-change:transform,opacity;opacity:0}
#star svg{position:absolute;inset:0;width:100%;height:100%}
#sCream{opacity:0} body.m #star{width:90px;height:90px}
.nav{position:absolute;top:50%;width:44px;height:44px;border:0;background:none;font:22px Georgia,serif;color:var(--ink);display:none;z-index:5;transform:translateY(-50%)}
body.m .nav{display:block}
.note{position:absolute;right:14px;bottom:10px;font:11px/1.5 "Noto Serif CJK SC",serif;color:var(--ink);z-index:6}
body.m .note{left:8px;right:8px;bottom:4px;font-size:9px;text-align:center}
#cap{z-index:4;position:absolute;left:3vw;top:50%;width:min(20vw,280px);transform:translateY(-50%);color:var(--ink);font-family:CabinetSong,"Noto Serif CJK SC",serif;opacity:0;transition:opacity .25s;z-index:4;pointer-events:none}
#cap.on{opacity:1}
#cap .zh{font-size:26px;letter-spacing:.14em;margin:0 0 4px}
#cap .la{font:italic 12px Georgia,serif;letter-spacing:.18em;margin:0 0 14px}
#cap .def{font-size:15px;line-height:1.75;margin:0 0 12px}
#cap .cr{font:10px/1.5 "Noto Serif CJK SC",serif;margin:0;border-top:1px solid var(--ink);padding-top:8px}
body.m #cap{z-index:4;left:5vw;right:5vw;width:auto;top:1.5vh;transform:none;text-align:center}
body.m #cap .zh,body.m #cap .la{display:none} body.m #cap .def{font-size:13px;margin:0 0 4px} body.m #cap .cr{font-size:9px;border:0;padding:0}
#after{height:50vh;display:flex;align-items:center;justify-content:center;font:13px "Noto Serif CJK SC",serif;color:var(--ink)}
@media (prefers-reduced-motion: reduce){
  #p3{height:auto} .stage{position:relative;height:100vh}
  .night{display:none} .win-wrap img{opacity:1}
  #bg,#shrine,#woman,#text{animation:none;opacity:1}
}
</style></head><body>
<script>if(matchMedia('(max-width:899px)').matches)document.body.classList.add('m')</script>
<div id="desk">
 <section id="p1">
  <img class="lay" id="bg" src="assets/v4/bg.png" alt="">
  <img class="lay" id="shrine" src="assets/v4/shrine.png" alt="">
  <img class="lay" id="woman" src="assets/v4/woman.png" alt="">
  <img id="text" src="assets/v4/text.png" alt="">
 </section>
 <img id="p2" src="assets/v4/p2_nostar.png" alt="">
</div>
<div id="mob"><img id="mp1" src="assets/m_p1.png" alt="" width="390" height="844"><img id="mp2" src="assets/m_p2_nostar.png" alt="" width="390" height="1060"></div>
<section id="p3"><div class="stage" id="stage">
 <div class="win-wrap" id="wins">
  <img id="winWeb" class="on" src="assets/window-web.png" alt="P3 彩窗五联 · 彩色封面">
  <img id="winMob" src="assets/renders/window-mobile-c2.png" alt="P3 彩窗手机" style="display:none">
 </div>
 <div class="night sky" id="sky"></div>
 <div class="night water" id="water"><div class="wline"></div></div>
 <button class="nav" id="prev" aria-label="上一个专题" style="left:2vw">‹</button>
 <button class="nav" id="next" aria-label="下一个专题" style="right:2vw">›</button>
 <div id="cap"><p class="zh"></p><p class="la"></p><p class="def"></p><p class="cr"></p></div>
 <div class="note">P3 彩窗 v3 · 全量彩色封面 · 待夕里审 · 封面原色为例外</div>
</div></section>
<div id="after">（P4 书册未接入；v9 仍是 P3/P4 基线）</div>
<div id="star"><div id="sInk"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120"><style>.sio{fill:none;stroke:#1E1E1E;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:12}.sif{fill:none;stroke:#1E1E1E;stroke-width:.6;stroke-linecap:round}.sid{fill:#1E1E1E}</style><path d="M0.00,0.00 L-4.20,-9.00 L0.00,-44.00 L4.20,-9.00 Z" class="sio"/><path d="M0.00,-5.40 L0.00,-37.84" class="sif"/><path d="M0.00,0.00 L8.00,-3.60 L30.00,-0.00 L8.00,3.60 Z" class="sio"/><path d="M4.80,-0.00 L25.80,-0.00" class="sif"/><path d="M0.00,0.00 L4.20,9.00 L0.00,44.00 L-4.20,9.00 Z" class="sio"/><path d="M0.00,5.40 L0.00,37.84" class="sif"/><path d="M0.00,0.00 L-8.00,3.60 L-30.00,0.00 L-8.00,-3.60 Z" class="sio"/><path d="M-4.80,0.00 L-25.80,0.00" class="sif"/><path d="M0.00,0.00 L2.55,-5.94 L10.61,-10.61 L5.94,-2.55 Z" class="sio"/><path d="M2.55,-2.55 L9.12,-9.12" class="sif"/><path d="M0.00,0.00 L5.94,2.55 L10.61,10.61 L2.55,5.94 Z" class="sio"/><path d="M2.55,2.55 L9.12,9.12" class="sif"/><path d="M0.00,0.00 L-2.55,5.94 L-10.61,10.61 L-5.94,2.55 Z" class="sio"/><path d="M-2.55,2.55 L-9.12,9.12" class="sif"/><path d="M0.00,0.00 L-5.94,-2.55 L-10.61,-10.61 L-2.55,-5.94 Z" class="sio"/><path d="M-2.55,-2.55 L-9.12,-9.12" class="sif"/><circle cx="0" cy="0" r="5.2" class="sio" style="fill:#F6F3ED"/><circle cx="0" cy="0" r="2.6" class="sif"/></svg></div><div id="sCream"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120"><style>.sco{fill:none;stroke:#F6F3ED;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:12}.scf{fill:none;stroke:#F6F3ED;stroke-width:.6;stroke-linecap:round}.scd{fill:#F6F3ED}</style><path d="M0.00,0.00 L-4.20,-9.00 L0.00,-44.00 L4.20,-9.00 Z" class="sco"/><path d="M0.00,-5.40 L0.00,-37.84" class="scf"/><path d="M0.00,0.00 L8.00,-3.60 L30.00,-0.00 L8.00,3.60 Z" class="sco"/><path d="M4.80,-0.00 L25.80,-0.00" class="scf"/><path d="M0.00,0.00 L4.20,9.00 L0.00,44.00 L-4.20,9.00 Z" class="sco"/><path d="M0.00,5.40 L0.00,37.84" class="scf"/><path d="M0.00,0.00 L-8.00,3.60 L-30.00,0.00 L-8.00,-3.60 Z" class="sco"/><path d="M-4.80,0.00 L-25.80,0.00" class="scf"/><path d="M0.00,0.00 L2.55,-5.94 L10.61,-10.61 L5.94,-2.55 Z" class="sco"/><path d="M2.55,-2.55 L9.12,-9.12" class="scf"/><path d="M0.00,0.00 L5.94,2.55 L10.61,10.61 L2.55,5.94 Z" class="sco"/><path d="M2.55,2.55 L9.12,9.12" class="scf"/><path d="M0.00,0.00 L-2.55,5.94 L-10.61,10.61 L-5.94,2.55 Z" class="sco"/><path d="M-2.55,2.55 L-9.12,9.12" class="scf"/><path d="M0.00,0.00 L-5.94,-2.55 L-10.61,-10.61 L-2.55,-5.94 Z" class="sco"/><path d="M-2.55,-2.55 L-9.12,-9.12" class="scf"/><circle cx="0" cy="0" r="5.2" class="sco" style="fill:#1E1E1E"/><circle cx="0" cy="0" r="2.6" class="scf"/></svg></div></div>
<script>
const TOPICS={"liubai": {"zh": "留白", "la": "Liubai", "define": "留白不是空着省事，而是把必要的线索放好，再让观众走进未画出的部分。", "credit": "马远《寒江独钓图》（南宋，东京国立博物馆）· 公有领域 · 图源 Wikimedia Commons", "cover": "assets/feishu/covers/liubai.jpg"}, "melancholy": {"zh": "忧郁", "la": "Melancholy", "define": "忧郁，是生活还在继续，而有一部分自己停在了原地。", "credit": "Vilhelm Hammershøi《Interior, Strandgade 30》", "cover": "assets/feishu/covers/melancholy.jpeg"}, "eros": {"zh": "爱欲", "la": "Eros", "define": "爱欲从缺口里生长：你想要的还没得到，因此一直向它靠近。", "credit": "约翰内斯·维米尔《窗前读信的少女》（约 1657–1659，德累斯顿历代大师画廊）· 公有领域 · 图源 Wikimedia Commons", "cover": "assets/feishu/covers/eros.jpg"}, "arcadia": {"zh": "田园", "la": "Arcadia", "define": "田园给疲惫的人一处可想象的栖身之地，也让人暂时放慢脚步。", "credit": "文森特·凡·高《麦田里的收割者》（1889，阿姆斯特丹凡·高博物馆）· 公有领域 · 图源 Wikimedia Commons", "cover": "assets/feishu/covers/arcadia.jpg"}, "yugen": {"zh": "幽玄", "la": "Yūgen", "define": "幽玄把可见的部分留在眼前，让更深的一层停在难以说尽的地方。", "credit": "上村松园《序之舞》（1936，东京艺术大学大学美术馆）· 公有领域 · 图源 Wikimedia Commons", "cover": "assets/feishu/covers/yugen.jpg"}}, ORDER=["liubai", "melancholy", "eros", "arcadia", "yugen"];
const Q=new URLSearchParams(location.search);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const B=document.body; if(Q.get('p3only'))B.classList.add('p3only');
const cl=(v,a,b)=>Math.min(1,Math.max(0,(v-a)/(b-a))), ss=t=>t*t*(3-2*t), lerp=(a,b,t)=>a+(b-a)*t;
const $=s=>document.querySelector(s);
const star=$('#star'), sInk=$('#sInk'), sCream=$('#sCream'), stage=$('#stage'), sky=$('#sky'), water=$('#water');
const winWeb=$('#winWeb'), winMob=$('#winMob');
let M=false, ready=reduce, idx=2;
const ST=156, V4={x0:798,y0:422,x1:382,y1:1448,TOP:900};
function showCap(s){
  const c=$('#cap'); if(!s){c.classList.remove('on');return;}
  const t=TOPICS[s], p=[...c.querySelectorAll('p')];
  p[0].textContent=t.zh; p[1].textContent=t.la.toUpperCase(); p[2].textContent=t.define; p[3].textContent='封面：'+t.credit;
  c.classList.add('on');
}
function setMob(k){
  idx=(k+5)%5;
  winMob.src=`assets/renders/window-mobile-c${idx}.png`;
  showCap(ORDER[idx]);
}
function layout(){
  M=matchMedia('(max-width:899px)').matches; B.classList.toggle('m',M);
  winWeb.style.display=M?'none':'block'; winMob.style.display=M?'block':'none';
  winWeb.classList.toggle('on',!M); winMob.classList.toggle('on',M);
  const vh=innerHeight, sillY=vh*0.92;
  sky.style.height=sillY+'px'; water.style.height=(vh-sillY)+'px';
  sky.style.backgroundImage=`url(assets/junction-water-${M?'mob':'desk'}.png)`;
  if(M) showCap(ORDER[idx]); else showCap(null);
  update();
}
function chainEnd(){ return $('#p3').offsetTop; }
function docStart(){
  if(B.classList.contains('p3only')) return null;
  if(!M) return {x:V4.x1+($('#desk').getBoundingClientRect().left+scrollX),y:V4.y1};
  const k=innerWidth/390; return {x:70*k,y:(844+859)*k};
}
function update(){
  queued=false;
  const vh=innerHeight, y=scrollY, T=chainEnd(), sr=stage.getBoundingClientRect();
  const span=$('#p3').offsetHeight-vh, q=reduce?1:Math.min(1,Math.max(0,(y-T)/span));
  const size=M?90:ST, half=size/2;
document.querySelectorAll('.nav').forEach(b=>{b.style.visibility=(M&&(q>.7||reduce))?'visible':'hidden'});
  // night retreat
  const n=ss(cl(q,.06,.28));
  sky.style.clipPath=`inset(0 0 ${(n*100).toFixed(2)}% 0)`;
  water.style.transform=`translateY(${(n*(vh*0.08)+2*n).toFixed(1)}px)`;
  // window reveal
  const r=reduce?1:ss(cl(q,.18,.55));
  const img=M?winMob:winWeb;
  img.style.opacity=r.toFixed(3);
  img.style.clipPath=reduce?'none':`inset(${((1-r)*100).toFixed(2)}% 0 0 0)`;
  // star
  let sx,sy,ink=1, op=1;
  const s0=docStart();
  const win=img.getBoundingClientRect();
  // rose approx: upper centre of window image
  const cxS=win.left+win.width/2, roseS=win.top+win.height*0.18, sillS=win.bottom-win.height*0.08;
  if(reduce){ op=(!M&&s0)?1:0; sx=V4.x0+($('#desk').getBoundingClientRect().left); sy=V4.y0-y; ink=1; }
  else {
    const S1=T-vh; const bodyL=M?0:$('#desk').getBoundingClientRect().left;
    if(s0 && y<=S1){
      if(!M){ const p=S1>0?Math.min(1,Math.max(0,y/S1)):1, g=ss(cl(p,.03,1));
        const dx=(V4.x1-V4.x0)*(1-Math.pow(1-g,2)), dy=(V4.y1-V4.y0)*(g*g*.35+g*.65);
        sx=bodyL+V4.x0+dx; sy=V4.y0+dy-y; const c=ss(cl(V4.y0+dy,V4.TOP-30,V4.TOP+50)); ink=1-c; op=ready?1:0;
      } else { sx=s0.x; sy=s0.y-y; ink=0; }
    } else if(s0 && y<T){ const g=ss(cl(y,S1,T));
      const a={x:M?s0.x:bodyL+V4.x1,y:s0.y-y};
      sx=lerp(a.x,cxS,1-Math.pow(1-g,2)); sy=lerp(a.y,sillS-half*.5,g); ink=0;
    } else {
      const rr=ss(cl(q,.30,.70));
      sx=cxS; sy=lerp(sillS-half*.5,roseS,rr); ink=s0?ss(cl(q,.10,.18)):1;
    }
  }
  star.style.transform=`translate3d(${(sx-half).toFixed(1)}px,${(sy-half).toFixed(1)}px,0)`;
  sInk.style.opacity=ink.toFixed(3); sCream.style.opacity=(1-ink).toFixed(3); star.style.opacity=op;
}
let queued=false;
addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(update)}},{passive:true});
addEventListener('resize',layout);
if(!reduce){ setTimeout(()=>{ready=true;update()},2900); }
$('#prev').onclick=()=>setMob(idx-1); $('#next').onclick=()=>setMob(idx+1);
let px=null; stage.addEventListener('pointerdown',e=>{px=e.clientX});
stage.addEventListener('pointerup',e=>{ if(M&&px!==null&&Math.abs(e.clientX-px)>40) setMob(idx+(e.clientX<px?1:-1)); px=null; });
// desktop hover caption on centre — approximate via mouse over window centre third
winWeb.addEventListener('mousemove',e=>{
  if(M) return;
  const r=winWeb.getBoundingClientRect(); const u=(e.clientX-r.left)/r.width;
  const i=u<.28?0:u<.42?1:u<.58?2:u<.72?3:4;
  showCap(ORDER[i]);
});
winWeb.addEventListener('mouseleave',()=>{ if(!M) showCap(null); });
window.__q=v=>{ scrollTo(0,chainEnd()+v*($('#p3').offsetHeight-innerHeight)); };
window.__setMob=setMob;
addEventListener('load',layout); layout();
</script></body></html>
