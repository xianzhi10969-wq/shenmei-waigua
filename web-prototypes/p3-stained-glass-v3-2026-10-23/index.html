const TOPICS=[{"slug": "melancholy", "zh": "忧郁", "la": "Melancholy", "define": "忧郁，是生活还在继续，而有一部分自己停在了原地。", "credit": "Vilhelm Hammershøi《Interior, Strandgade 30》", "seq": 1, "pane": "assets/panes/melancholy.jpg"}, {"slug": "eros", "zh": "爱欲", "la": "Eros", "define": "爱欲从缺口里生长：你想要的还没得到，因此一直向它靠近。", "credit": "约翰内斯·维米尔《窗前读信的少女》（约 1657–1659，德累斯顿历代大师画廊）· 公有领域 · 图源 Wikimedia Commons", "seq": 2, "pane": "assets/panes/eros.jpg"}, {"slug": "arcadia", "zh": "田园", "la": "Arcadia", "define": "田园给疲惫的人一处可想象的栖身之地，也让人暂时放慢脚步。", "credit": "文森特·凡·高《麦田里的收割者》（1889，阿姆斯特丹凡·高博物馆）· 公有领域 · 图源 Wikimedia Commons", "seq": 3, "pane": "assets/panes/arcadia.jpg"}, {"slug": "yugen", "zh": "幽玄", "la": "Yūgen", "define": "幽玄把可见的部分留在眼前，让更深的一层停在难以说尽的地方。", "credit": "上村松园《序之舞》（1936，东京艺术大学大学美术馆）· 公有领域 · 图源 Wikimedia Commons", "seq": 4, "pane": "assets/panes/yugen.jpg"}, {"slug": "dionysian", "zh": "酒神", "la": "Dionysian", "define": "酒神让个人的边界暂时松开，情绪随着节奏涌进人群。", "credit": "提香《酒神与阿里阿德涅》（1520–1523，伦敦国家美术馆）· 公有领域 · 图源 Wikimedia Commons", "seq": 5, "pane": "assets/panes/dionysian.jpg"}, {"slug": "liubai", "zh": "留白", "la": "Liubai", "define": "留白不是空着省事，而是把必要的线索放好，再让观众走进未画出的部分。", "credit": "马远《寒江独钓图》（南宋，东京国立博物馆）· 公有领域 · 图源 Wikimedia Commons", "seq": 6, "pane": "assets/panes/liubai.jpg"}, {"slug": "pingdan", "zh": "平淡", "la": "Pingdan", "define": "平淡把复杂经历收在很轻的表达里；情绪没有消失，只是不急着外露。", "credit": "维尔海姆·哈默修伊《斯特兰德街的室内，地板上的阳光》（1901，丹麦国立美术馆）· 公有领域 · 图源 Wikimedia Commons", "seq": 7, "pane": "assets/panes/pingdan.jpg"}, {"slug": "mono-no-aware", "zh": "物哀", "la": "Mono no aware", "define": "物哀是心被眼前的事物轻轻碰到，也知道这一刻不会永远停着。", "credit": "亨利·霍利迪《但丁与贝雅特丽齐》（1883，利物浦沃克美术馆）· 公有领域 · 图源 Wikimedia Commons", "seq": 8, "pane": "assets/panes/mono-no-aware.jpg"}, {"slug": "infra-ordinary", "zh": "日常", "la": "Infra-ordinary", "define": "日常由那些天天发生、因太熟悉而常被略过的动作组成。", "credit": "费利克斯·瓦洛东《晚餐，灯光效果》（1899，巴黎奥赛博物馆）· 公有领域 · 图源 Wikimedia Commons", "seq": 9, "pane": "assets/panes/infra-ordinary.jpg"}, {"slug": "wabi-sabi", "zh": "侘寂", "la": "Wabi-sabi", " const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const B=document.body; if(Q.get('p3only'))B.classList.add('p3only');
const cl=(v,a,b)=>Math.min(1,Math.max(0,(v-a)/(b-a))), ss=t=>t*t*(3-2*t), lerp=(a,b,t)=>a+(b-a)*t;
const $=s=>document.querySelector(s);
const star=$('#star'), sInk=$('#sInk'), sCream=$('#sCream'), stage=$('#stage'), sky=$('#sky'), water=$('#water');
const win=$('#win'), panes=$('#panes'), chassis=$('#chassis'), ctitle=$('#ctitle');
let M=false, ready=reduce, idx=1; // start at 爱欲 (序号2) index 1
let slotEls=[], mid=2;
const ST=156, V4={x0:798,y0:422,x1:382,y1:1448,TOP:900};

function wrap(i){ return ((i%N)+N)%N; }
function showCap(t){
  const c=$('#cap'); if(!t){c.classList.remove('on');return;}
  const p=[...c.querySelectorAll('p')];
  p[0].textContent=t.zh; p[1].textContent=t.la.toUpperCase(); p[2].textContent=t.define; p[3].textContent=t.credit?('封面：'+t.credit):'';
  c.classList.add('on');
}
function layoutWin(){
  const ch=CHASSIS[M?'mobile':'web'];
  const vh=innerHeight, vw=innerWidth;
  const maxH=M?vh*0.86:vh*0.90, maxW=vw*0.94;
  const sc=Math.min(maxH/ch.size[1], maxW/ch.size[0]);
  const W=ch.size[0]*sc, H=ch.size[1]*sc;
  Object.assign(win.style,{width:W+'px',height:H+'px'});
  chassis.src=`assets/renders/chassis-${M?'mobile':'web'}.png`;
  mid=M?1:2;
  const need=ch.slots.length;
  while(slotEls.length<need){
    const d=document.createElement('div'); d.className='pane';
    const im=document.createElement('img'); im.alt=''; d.appendChild(im); panes.appendChild(d); slotEls.push({el:d,img:im});
  }
  slotEls.forEach((s,i)=>{ s.el.style.display=i<need?'block':'none'; });
  ch.slots.forEach((s,i)=>{
    const [x,y,w,h]=s.fill_box;
    Object.assign(slotEls[i].el.style,{left:(x*sc)+'px',top:(y*sc)+'px',width:(w*sc)+'px',height:(h*sc)+'px'});
  });
  // centre title over centre cart only
  const cb=ch.slots[mid].cart_box;
  Object.assign(ctitle.style,{
    left:(cb[0]*sc)+'px', top:(cb[1]*sc)+'px', width:(cb[2]*sc)+'px', height:(cb[3]*sc)+'px'
  });
  const zh=ctitle.querySelector('.zh'); const la=ctitle.querySelector('.la');
  zh.style.fontSize=Math.max(14, cb[3]*sc*0.32)+'px';
  la.style.fontSize=Math.max(9, cb[3]*sc*0.12)+'px';
  paint();
}
function paint(){
  const ch=CHASSIS[M?'mobile':'web'];
  const n=ch.slots.length;
  for(let i=0;i<n;i++){
    const ti=wrap(idx+(i-mid));
    const t=TOPICS[ti];
    const im=slotEls[i].img;
    if(im.dataset.slug!==t.slug){ im.dataset.slug=t.slug; im.src=t.pane; }
    // side panes slightly dimmer? keep full colour
  }
  const t=TOPICS[idx];
  ctitle.querySelector('.zh').textContent=[...t.zh].join('　');
  ctitle.querySelector('.la').textContent=t.la.toUpperCase().split('').join(' ');
  ctitle.classList.add('on'); // ONLY centre title text — side scrolls stay empty outlines on chassis
  showCap(t);
  $('#dot').textContent=`${t.seq} / ${N}  ·  ${t.zh}`;
}
function snap(d){ idx=wrap(idx+d); paint(); }

function layout(){
  M=matchMedia('(max-width:899px)').matches; B.classList.toggle('m',M);
  layoutWin();
  const vh=innerHeight, sillY=vh*0.92;
  sky.style.height=sillY+'px'; water.style.height=(vh-sillY)+'px';
  sky.style.backgroundImage=`url(assets/junction-water-${M?'mob':'desk'}.png)`;
  update();
}
function chainEnd(){ return $('#p3').offsetTop; }
function docStart(){
  if(B.classList.contains('p3only')) return null;
  if(!M) return {x:V4.x1+($('#desk').getBoundingClientRect().left+scrollX),y:V4.y1};
  const k=innerWidth/390; return {x:70*k,y:(844+859)*k};
}
function update(){
  queued=false;
  const vh=innerHeight, y=scrollY, T=chainEnd();
  const span=$('#p3').offsetHeight-vh, q=reduce?1:Math.min(1,Math.max(0,(y-T)/span));
  const size=M?90:ST, half=size/2;
  document.querySelectorAll('.nav').forEach(b=>b.style.visibility=(q>.55||reduce)?'visible':'hidden');
  const n=ss(cl(q,.06,.28));
  sky.style.clipPath=`inset(0 0 ${(n*100).toFixed(2)}% 0)`;
  water.style.transform=`translateY(${(n*(vh*0.08)+2*n).toFixed(1)}px)`;
  const r=reduce?1:ss(cl(q,.18,.55));
  win.style.opacity=r.toFixed(3);
  win.style.clipPath=reduce?'none':`inset(${((1-r)*100).toFixed(2)}% 0 0 0)`;
  let sx,sy,ink=1,op=1;
  const s0=docStart();
  const wr=win.getBoundingClientRect();
  const cxS=wr.left+wr.width/2, roseS=wr.top+wr.height*0.18, sillS=wr.bottom-wr.height*0.08;
  if(reduce){ op=(!M&&s0)?1:0; sx=V4.x0+($('#desk').getBoundingClientRect().left); sy=V4.y0-y; ink=1; }
  else {
    const S1=T-vh; const bodyL=M?0:$('#desk').getBoundingClientRect().left;
    if(s0 && y<=S1){
      if(!M){ const p=S1>0?Math.min(1,Math.max(0,y/S1)):1, g=ss(cl(p,.03,1));
        const dx=(V4.x1-V4.x0)*(1-Math.pow(1-g,2)), dy=(V4.y1-V4.y0)*(g*g*.35+g*.65);
        sx=bodyL+V4.x0+dx; sy=V4.y0+dy-y; const c=ss(cl(V4.y0+dy,V4.TOP-30,V4.TOP+50)); ink=1-c; op=ready?1:0;
      } else { sx=s0.x; sy=s0.y-y; ink=0; }
    } else if(s0 && y<T){ const g=ss(cl(y,S1,T));
      const a={x:M?s0.x:bodyL+V4.x1,y:s0.y-y};
      sx=lerp(a.x,cxS,1-Math.pow(1-g,2)); sy=lerp(a.y,sillS-half*.5,g); ink=0;
    } else {
      const rr=ss(cl(q,.30,.70));
      sx=cxS; sy=lerp(sillS-half*.5,roseS,rr); ink=s0?ss(cl(q,.10,.18)):1;
    }
  }
  star.style.transform=`translate3d(${(sx-half).toFixed(1)}px,${(sy-half).toFixed(1)}px,0)`;
  sInk.style.opacity=ink.toFixed(3); sCream.style.opacity=(1-ink).toFixed(3); star.style.opacity=op;
}
let queued=false;
addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(update)}},{passive:true});
addEventListener('resize',layout);
if(!reduce) setTimeout(()=>{ready=true;update()},2900);

// ---- snap ONE lancet at a time (no free scroll) ----
$('#prev').onclick=()=>snap(-1); $('#next').onclick=()=>snap(1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){e.preventDefault();snap(-1);}
  if(e.key==='ArrowRight'){e.preventDefault();snap(1);}
});
let px=null, dragging=false;
win.addEventListener('pointerdown',e=>{px=e.clientX; dragging=true; win.setPointerCapture?.(e.pointerId);});
win.addEventListener('pointerup',e=>{
  if(!dragging||px===null) return;
  const dx=e.clientX-px; px=null; dragging=false;
  if(Math.abs(dx)>36) snap(dx<0?1:-1); // swipe left → next topic
});
win.addEventListener('pointercancel',()=>{px=null;dragging=false;});
// trackpad / wheel: horizontal intent snaps one
let wheelLock=false;
win.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaX)<Math.abs(e.deltaY)*1.2) return; // ignore vertical page scroll
  e.preventDefault();
  if(wheelLock) return;
  if(Math.abs(e.deltaX)<8) return;
  wheelLock=true; snap(e.deltaX>0?1:-1);
  setTimeout(()=>wheelLock=false, 280);
},{passive:false});

window.__q=v=>{ scrollTo(0,chainEnd()+v*($('#p3').offsetHeight-innerHeight)); };
window.__snap=snap; window.__setIdx=i=>{idx=wrap(i);paint();};
addEventListener('load',layout); layout();
</script></body></html>
