<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>审美外挂 · P3 Aha 实验 · 中窗点亮（2026-10-23）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:CabinetSong;src:url(assets/cabinet-song.ttf) format("truetype");font-display:block}
:root{--ink:#1E1E1E;--paper:#F6F3ED}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);overflow:hidden}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--ink)}
.win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;touch-action:none;cursor:default;user-select:none}
.win.unlocked{cursor:grab}
.win.unlocked:active{cursor:grabbing}
.panes{position:absolute;inset:0}
.pane{position:absolute;overflow:hidden;background:var(--ink)}
.pane img{
  width:100%;height:100%;object-fit:cover;object-position:center 30%;
  display:block;pointer-events:none;
  opacity:0; filter:brightness(.15) saturate(.4);
  transition:opacity .9s cubic-bezier(.22,.61,.36,1), filter .9s cubic-bezier(.22,.61,.36,1);
}
.pane.is-side img{opacity:0;filter:brightness(0) saturate(0)}
.pane.is-center.lit img{opacity:1;filter:brightness(1) saturate(1)}
/* after unlock, sides stay night-glass silhouettes so focus stays on centre */
body.phase-unlocked .pane.is-side img{opacity:.18;filter:brightness(.25) saturate(.2)}
.chassis{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block;
  opacity:.22; transition:opacity 1.1s cubic-bezier(.22,.61,.36,1)}
body.phase-center .chassis,
body.phase-title .chassis,
body.phase-unlocked .chassis{opacity:1}
.ctitle{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--paper);text-align:center;pointer-events:none;
  opacity:0; transform:translateY(6px);
  transition:opacity .55s cubic-bezier(.22,.61,.36,1), transform .55s cubic-bezier(.22,.61,.36,1)}
.ctitle.on{opacity:1;transform:translateY(0)}
.ctitle .zh{font-family:CabinetSong,"Noto Serif CJK SC",serif;letter-spacing:.14em;margin:0;line-height:1.1}
.ctitle .la{font:italic 0.55em Georgia,serif;letter-spacing:.18em;margin:.2em 0 0;opacity:.95}
.nav{position:absolute;top:50%;width:48px;height:48px;border:0;background:none;
  font:28px Georgia,serif;color:var(--paper);z-index:5;transform:translateY(-50%);
  cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
body.phase-unlocked .nav{opacity:.85;pointer-events:auto}
.nav:hover{opacity:1}
#prev{left:1.2vw}#next{right:1.2vw}
#dot{position:absolute;left:50%;bottom:2.2vh;transform:translateX(-50%);
  font:11px/1 Georgia,serif;letter-spacing:.08em;opacity:0;z-index:6;transition:opacity .4s}
body.phase-unlocked #dot{opacity:.75}
#hint{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);
  font:12px/1.5 "Noto Serif CJK SC",serif;opacity:0;z-index:6;text-align:center;
  transition:opacity .5s;pointer-events:none;letter-spacing:.06em}
body.phase-dark #hint,body.phase-center #hint{opacity:.55}
body.phase-title #hint,body.phase-unlocked #hint{opacity:0}
#skip{position:absolute;right:14px;top:12px;z-index:8;font:11px/1.4 "Noto Serif CJK SC",serif;
  color:var(--paper);opacity:.45;background:none;border:0;cursor:pointer;letter-spacing:.08em}
#skip:hover{opacity:.9}
body.phase-unlocked #skip{display:none}
.note{position:absolute;left:14px;top:12px;font:11px/1.5 "Noto Serif CJK SC",serif;
  opacity:.55;z-index:6;pointer-events:none;max-width:46vw}
body.m .note{font-size:9px;max-width:70vw}
body.m #hint{bottom:8vh;font-size:11px;padding:0 12px}
@media (prefers-reduced-motion:reduce){
  .pane img,.chassis,.ctitle,.nav,#dot,#hint{transition:none!important}
}
</style>
</head>
<body class="phase-dark">
<script>if(matchMedia('(max-width:899px)').matches)document.body.classList.add('m')</script>
<div id="stage">
  <div class="note">P3 Aha 实验 · 中窗点亮 · 约 3 秒 · 任意键/点击跳过 · 待夕里审</div>
  <button id="skip" type="button" aria-label="跳过开场">跳过 ▸</button>
  <div class="win" id="win" aria-label="一级专题彩窗">
    <div class="panes" id="panes"></div>
    <img class="chassis" id="chassis" alt="">
    <div class="ctitle" id="ctitle"><p class="zh"></p><p class="la"></p></div>
  </div>
  <button class="nav" id="prev" aria-label="上一个专题">‹</button>
  <button class="nav" id="next" aria-label="下一个专题">›</button>
  <div id="hint">暗厅里，光从中窗透出来…</div>
  <div id="dot"></div>
</div>
<script>
const TOPICS=[
{"slug":"melancholy","zh":"忧郁","la":"Melancholy","seq":1,"pane":"assets/panes/melancholy.jpg"},
{"slug":"eros","zh":"爱欲","la":"Eros","seq":2,"pane":"assets/panes/eros.jpg"},
{"slug":"arcadia","zh":"田园","la":"Arcadia","seq":3,"pane":"assets/panes/arcadia.jpg"},
{"slug":"yugen","zh":"幽玄","la":"Yūgen","seq":4,"pane":"assets/panes/yugen.jpg"},
{"slug":"dionysian","zh":"酒神","la":"Dionysian","seq":5,"pane":"assets/panes/dionysian.jpg"},
{"slug":"liubai","zh":"留白","la":"Liubai","seq":6,"pane":"assets/panes/liubai.jpg"},
{"slug":"pingdan","zh":"平淡","la":"Pingdan","seq":7,"pane":"assets/panes/pingdan.jpg"},
{"slug":"mono-no-aware","zh":"物哀","la":"Mono no aware","seq":8,"pane":"assets/panes/mono-no-aware.jpg"},
{"slug":"infra-ordinary","zh":"日常","la":"Infra-ordinary","seq":9,"pane":"assets/panes/infra-ordinary.jpg"},
{"slug":"wabi-sabi","zh":"侘寂","la":"Wabi-sabi","seq":10,"pane":"assets/panes/wabi-sabi.jpg"},
{"slug":"qiyun","zh":"气韵","la":"Qiyun","seq":11,"pane":"assets/panes/qiyun.jpg"},
{"slug":"xia","zh":"侠","la":"Xia","seq":12,"pane":"assets/panes/xia.jpg"},
{"slug":"lightness","zh":"轻逸","la":"Lightness","seq":13,"pane":"assets/panes/lightness.jpg"},
{"slug":"sublime","zh":"崇高","la":"Sublime","seq":14,"pane":"assets/panes/sublime.jpg"},
{"slug":"sprezzatura","zh":"从容","la":"Sprezzatura","seq":15,"pane":"assets/panes/sprezzatura.jpg"},
{"slug":"cool","zh":"酷","la":"Cool","seq":16,"pane":"assets/panes/cool.jpg"},
{"slug":"grotesque","zh":"怪诞","la":"Grotesque","seq":17,"pane":"assets/panes/grotesque.jpg"},
{"slug":"in-praise-of-shadows","zh":"阴翳","la":"In Praise of Shadows","seq":18,"pane":"assets/panes/in-praise-of-shadows.jpg"},
{"slug":"tragic","zh":"悲剧","la":"Tragic","seq":19,"pane":"assets/panes/tragic.jpg"},
{"slug":"ruin","zh":"废墟","la":"Ruin","seq":20,"pane":"assets/panes/ruin.jpg"},
{"slug":"future-imaginaries","zh":"未来想象","la":"Future Imaginaries","seq":21,"pane":"assets/panes/future-imaginaries.jpg"},
{"slug":"nostalgia","zh":"乡愁","la":"Nostalgia","seq":22,"pane":"assets/panes/nostalgia.jpg"},
{"slug":"uncanny","zh":"诡异","la":"Uncanny","seq":23,"pane":"assets/panes/uncanny.jpg"},
{"slug":"cute","zh":"可爱","la":"Cute","seq":24,"pane":"assets/panes/cute.jpg"}
];
const CHASSIS={
web:{"kind":"web","size":[3211,3610],"slots":[
{"fill_box":[86,1196,424,1954],"cart_box":[74,3169,448,402]},
{"fill_box":[574,1036,573,2114],"cart_box":[623,3170,517,400]},
{"fill_box":[1226,1096,780,2054],"cart_box":[1270,3170,704,401]},
{"fill_box":[2111,1039,555,2111],"cart_box":[2098,3169,520,401]},
{"fill_box":[2729,1201,421,1949],"cart_box":[2715,3169,447,401]}
]},
mobile:{"kind":"mobile","size":[1084,2469],"slots":[
{"fill_box":[40,606,222,1538],"cart_box":[31,2188,160,183]},
{"fill_box":[296,577,477,1565],"cart_box":[305,2158,477,282]},
{"fill_box":[824,556,221,1583],"cart_box":[896,2186,159,185]}
]}
};
const N=TOPICS.length;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const B=document.body;
const $=s=>document.querySelector(s);
const win=$('#win'), panes=$('#panes'), chassis=$('#chassis'), ctitle=$('#ctitle');
let M=false, idx=1, mid=2, unlocked=false, phase='dark';
let slotEls=[], timers=[];

function wrap(i){return ((i%N)+N)%N}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function setPhase(p){
  phase=p;
  B.classList.remove('phase-dark','phase-center','phase-title','phase-unlocked');
  B.classList.add('phase-'+p);
}
function paint(){
  const ch=CHASSIS[M?'mobile':'web'];
  const n=ch.slots.length;
  for(let i=0;i<n;i++){
    const ti=wrap(idx+(i-mid));
    const t=TOPICS[ti];
    const s=slotEls[i];
    if(s.img.dataset.slug!==t.slug){s.img.dataset.slug=t.slug;s.img.src=t.pane}
    s.el.classList.toggle('is-center', i===mid);
    s.el.classList.toggle('is-side', i!==mid);
    // centre lit once we have left pure dark (or always when unlocked / reduced)
    const lit = (i===mid) && (phase!=='dark' || reduce);
    s.el.classList.toggle('lit', lit);
  }
  const t=TOPICS[idx];
  ctitle.querySelector('.zh').textContent=[...t.zh].join('　');
  ctitle.querySelector('.la').textContent=t.la.toUpperCase().split('').join(' ');
  $('#dot').textContent=`${t.seq} / ${N}  ·  ${t.zh}`;
}
function layoutWin(){
  const ch=CHASSIS[M?'mobile':'web'];
  const vh=innerHeight, vw=innerWidth;
  const maxH=M?vh*0.86:vh*0.90, maxW=vw*0.94;
  const sc=Math.min(maxH/ch.size[1], maxW/ch.size[0]);
  const W=ch.size[0]*sc, H=ch.size[1]*sc;
  Object.assign(win.style,{width:W+'px',height:H+'px'});
  chassis.src=`assets/renders/chassis-${M?'mobile':'web'}.png`;
  mid=M?1:2;
  const need=ch.slots.length;
  while(slotEls.length<need){
    const d=document.createElement('div'); d.className='pane';
    const im=document.createElement('img'); im.alt=''; d.appendChild(im);
    panes.appendChild(d); slotEls.push({el:d,img:im});
  }
  slotEls.forEach((s,i)=>{s.el.style.display=i<need?'block':'none'});
  ch.slots.forEach((s,i)=>{
    const [x,y,w,h]=s.fill_box;
    Object.assign(slotEls[i].el.style,{left:(x*sc)+'px',top:(y*sc)+'px',width:(w*sc)+'px',height:(h*sc)+'px'});
  });
  const cb=ch.slots[mid].cart_box;
  Object.assign(ctitle.style,{
    left:(cb[0]*sc)+'px', top:(cb[1]*sc)+'px', width:(cb[2]*sc)+'px', height:(cb[3]*sc)+'px'
  });
  ctitle.querySelector('.zh').style.fontSize=Math.max(14, cb[3]*sc*0.32)+'px';
  ctitle.querySelector('.la').style.fontSize=Math.max(9, cb[3]*sc*0.12)+'px';
  paint();
}
function layout(){
  M=matchMedia('(max-width:899px)').matches;
  B.classList.toggle('m',M);
  layoutWin();
}
function snap(d){
  if(!unlocked) return;
  idx=wrap(idx+d);
  paint();
  // brief re-bleed on new centre
  const midEl=slotEls[mid]?.el;
  if(midEl){
    midEl.classList.remove('lit');
    requestAnimationFrame(()=>requestAnimationFrame(()=>midEl.classList.add('lit')));
  }
}
function unlock(){
  unlocked=true;
  setPhase('unlocked');
  ctitle.classList.add('on');
  win.classList.add('unlocked');
  paint();
}
function goFinal(){
  clearTimers();
  setPhase('center'); // ensure lit class logic
  paint();
  ctitle.classList.add('on');
  unlock();
}
function startAha(){
  clearTimers();
  unlocked=false;
  win.classList.remove('unlocked');
  ctitle.classList.remove('on');
  setPhase('dark');
  paint();
  if(reduce){ goFinal(); return; }
  // ~3s sequence
  // 0.35s settle dark → centre light
  timers.push(setTimeout(()=>{
    setPhase('center');
    paint();
  }, 350));
  // half beat after light (~1.9s): title
  timers.push(setTimeout(()=>{
    setPhase('title');
    ctitle.classList.add('on');
  }, 1900));
  // unlock at ~3.0s
  timers.push(setTimeout(()=>{
    unlock();
  }, 3000));
}
function onSkip(e){
  if(unlocked) return;
  e?.preventDefault?.();
  goFinal();
}
$('#skip').onclick=onSkip;
$('#stage').addEventListener('pointerdown',e=>{
  if(unlocked) return;
  if(e.target.closest('.nav,#skip')) return;
  onSkip(e);
});
addEventListener('keydown',e=>{
  if(!unlocked){
    if(e.key==='Escape'||e.key===' '||e.key==='Enter'||e.key==='ArrowLeft'||e.key==='ArrowRight'){
      e.preventDefault(); onSkip(e); return;
    }
  } else {
    if(e.key==='ArrowLeft'){e.preventDefault();snap(-1)}
    if(e.key==='ArrowRight'){e.preventDefault();snap(1)}
  }
});
$('#prev').onclick=()=>snap(-1);
$('#next').onclick=()=>snap(1);
let px=null, dragging=false;
win.addEventListener('pointerdown',e=>{
  if(!unlocked) return;
  px=e.clientX; dragging=true; win.setPointerCapture?.(e.pointerId);
});
win.addEventListener('pointerup',e=>{
  if(!unlocked||!dragging||px===null) return;
  const dx=e.clientX-px; px=null; dragging=false;
  if(Math.abs(dx)>36) snap(dx<0?1:-1);
});
win.addEventListener('pointercancel',()=>{px=null;dragging=false});
let wheelLock=false;
win.addEventListener('wheel',e=>{
  if(!unlocked) return;
  if(Math.abs(e.deltaX)<Math.abs(e.deltaY)*1.2) return;
  e.preventDefault();
  if(wheelLock||Math.abs(e.deltaX)<8) return;
  wheelLock=true; snap(e.deltaX>0?1:-1);
  setTimeout(()=>wheelLock=false,280);
},{passive:false});

// debug hooks for screenshots / recording
window.__setPhase=p=>{
  clearTimers();
  if(p==='dark'){unlocked=false;win.classList.remove('unlocked');ctitle.classList.remove('on');setPhase('dark');paint()}
  else if(p==='center'){unlocked=false;win.classList.remove('unlocked');ctitle.classList.remove('on');setPhase('center');paint()}
  else if(p==='title'){unlocked=false;win.classList.remove('unlocked');setPhase('title');ctitle.classList.add('on');paint()}
  else if(p==='unlocked'){goFinal()}
};
window.__snap=snap; window.__setIdx=i=>{idx=wrap(i);paint()};
window.__replay=startAha;

addEventListener('resize',layout);
const freeze=new URLSearchParams(location.search).has('freeze');
addEventListener('load',()=>{layout(); if(freeze){goFinal(); if(new URLSearchParams(location.search).get('freeze')==='dark'){unlocked=false;win.classList.remove('unlocked');ctitle.classList.remove('on');setPhase('dark');paint();}} else startAha();});
layout();
</script>
</body>
</html>
