<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面完整画幅修复 · 待审</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e6df;color:#24221f;font:13px 'Songti SC',serif}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #c5c0b5}h1{font-size:14px;font-weight:400;margin:0 12px 0 0}button,a{font:inherit;color:inherit;background:transparent;border:1px solid #a9a397;padding:6px 12px;text-decoration:none;cursor:pointer}input{width:230px;accent-color:#35312a}.frame{margin:20px auto;width:1440px;height:900px;max-width:100%;box-shadow:0 0 0 1px #c5c0b5}iframe{display:block;border:0;width:100%;height:100%}.mobile{width:390px;height:844px}p{margin:0 auto 20px;text-align:center;font-size:12px;color:#645e52}.frame{position:relative;overflow:hidden}iframe{transform-origin:top left}</style><header><h1>P2 → P3 · 桌面画幅修复</h1><button id="to-water">回到水面</button><input id="progress" aria-label="转场进度" type="range" min="0" max="1000" value="0"><button id="to-window">进入彩窗</button><button id="play">往返预览</button><a id="device" href="?device=mobile">看手机版</a><button id="night">停留在镂空夜色</button><a href="../p2-p3-cut-paper-v1-2026-10-24/review.html?device=mobile" target="_blank">对照上一版</a></header><div id="frame" class="frame"><iframe id="demo" src="./" title="镂空纸页可滚动预览"></iframe></div><p>水面星升起，随纸面切换线色，在玫瑰窗中心收住。上滑沿原路回到水面。</p><script>
const mobile=new URLSearchParams(location.search).get('device')==='mobile',box=document.getElementById('frame'),f=document.getElementById('demo'),slider=document.getElementById('progress'),play=document.getElementById('play');
if(mobile){box.classList.add('mobile');document.getElementById('device').href='?device=desktop';document.getElementById('device').textContent='看桌面版';}
function fitPreview(){const w=mobile?390:1440,h=mobile?844:900,scale=Math.min(1,document.documentElement.clientWidth/w);box.style.width=(w*scale)+'px';box.style.height=(h*scale)+'px';f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+scale+')';}fitPreview();addEventListener('resize',fitPreview);
let frame=null,loaded=false;const controls=[slider,...document.querySelectorAll('button')];controls.forEach(c=>c.disabled=true);
function stop(){if(frame!==null)cancelAnimationFrame(frame);frame=null;play.textContent='往返预览';}
const send=(q,immediate=true)=>{if(!loaded)return;f.contentWindow.postMessage({type:'review-scroll',progress:q,immediate},location.origin);};
document.getElementById('to-water').onclick=()=>{stop();send(0,false);};document.getElementById('to-window').onclick=()=>{stop();send(1,false);};slider.oninput=()=>{stop();send(slider.value/1000);};
play.onclick=()=>{if(frame!==null){stop();return;}play.textContent='停止预览';let t0;function tick(t){t0??=t;const s=(t-t0)/9000,q=s<.48?s/.48:s<.56?1:s<1?1-(s-.56)/.44:0;send(Math.min(1,Math.max(0,q)));if(s<1)frame=requestAnimationFrame(tick);else stop();}frame=requestAnimationFrame(tick);};
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==f.contentWindow)return;const d=e.data;if(d?.type==='review-ready'){loaded=true;controls.forEach(c=>c.disabled=false);}else if(d?.type==='review-progress'){slider.value=Math.round(d.progress*1000);}else if(d?.type==='review-interaction')stop();});
let hold=false;document.getElementById('night').onclick=()=>{stop();hold=!hold;f.contentWindow.postMessage({type:'review-night',value:hold},location.origin);document.getElementById('night').textContent=hold?'恢复原色封面':'停留在镂空夜色';};
</script></html>
