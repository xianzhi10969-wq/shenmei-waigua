<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinterest 拼贴 · v3</title><style>*{box-sizing:border-box}body{margin:0;background:#eeedeb;color:#242424;font:14px system-ui}header{position:sticky;top:0;z-index:2;background:#fff;padding:15px 24px;border-bottom:1px solid #d6d6d6}nav,.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools{margin-top:12px;padding-top:12px;border-top:1px solid #eee}button{border:1px solid #ccc;border-radius:0;padding:9px 13px;background:white;color:#444;cursor:pointer;font:inherit}button.active{background:#252525;color:white;border-color:#252525}small{color:#777;margin-left:auto}main{max-width:1200px;margin:24px auto 60px}iframe{border:0;background:white;display:block;width:100%}#photo{display:block;max-width:100%;margin:auto}#status{padding:14px 24px;color:#666;line-height:1.6;margin:0}#sheet{background:white}a{color:inherit}@media(max-width:600px){header{padding:10px}button{padding:7px 9px;font-size:12px}main{margin-top:12px}small{display:none}}dialog{border:0;padding:20px;background:#fff;max-width:94vw;width:1000px;max-height:94vh}dialog::backdrop{background:#000b}#full{max-width:100%;max-height:76vh;display:block;margin:14px auto;object-fit:contain}.dialogbar{display:flex;gap:14px;align-items:center}.dialogbar span{flex:1}</style><header><nav><button data-slug="softcore">Softcore</button><button data-slug="midsummer">盛夏</button><button data-slug="dopamine">多巴胺</button><button data-slug="decadence">颓废美学</button><button data-slug="retro-rock">复古摇滚</button><small>去重重拼 v3 · 已确认</small></nav><div class="tools"><button data-mode="new">去重重拼 v3</button><button data-mode="sparse">疏排 v1</button><button data-mode="old">Grokbot 旧稿</button><button data-mode="gold">Coquette 参考</button><button data-size="desktop">桌面</button><button data-size="mobile">手机</button><button id="labels">显示编号</button><a href="sources.html" target="_blank">素材与出处</a><a id="download" download>下载预览图</a></div></header><main><div id="sheet"><iframe title="拼贴预览" id="art"></iframe><img id="photo" alt="拼贴参考图"></div><p id="status"></p></main><dialog id="original"><div class="dialogbar"><span id="caption"></span><a id="official" target="_blank" rel="noopener">原作出处 ↗</a><button id="close">关闭</button></div><img id="full" alt="完整原作"></dialog><script>
let slug=new URLSearchParams(location.search).get('board')||'retro-rock',mode='new',size=innerWidth<600?'mobile':'desktop';const art=document.querySelector('#art'),photo=document.querySelector('#photo'),sheet=document.querySelector('#sheet');
function fit(){let w=Math.min(size==='mobile'?390:1200,document.querySelector('main').clientWidth);sheet.style.width=w+'px';sheet.style.margin='auto';art.style.height=w*(size==='mobile'?1080/390:1000/1200)+'px'}
function update(){const isNew=mode==='new';art.style.display=isNew?'block':'none';photo.style.display=isNew?'none':'block';if(isNew)art.src='new/'+slug+'-'+size+'.html';else photo.src=mode==='sparse'?'comparisons/'+slug+'-'+size+'.png':mode==='old'?'source/web-prototypes/term-collage-trial-'+slug+'-2026-11-05/previews/'+size+'-board-chat.jpg':'reference/coquette-'+size+'.png';document.querySelectorAll('[data-slug]').forEach(b=>b.classList.toggle('active',b.dataset.slug===slug));document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b.dataset.size===size));document.querySelector('#download').href=isNew?'new/'+slug+'-'+size+'.png':photo.src;document.querySelector('#status').textContent=isNew?'每件作品只出现一次。点击图像查看完整原作与出处；新增参考图尚未加入案例库。':mode==='sparse'?'上一轮疏排稿，保留作密度对照。':mode==='old'?'2026-11-05 原试稿，保留作对照。':'Coquette 已认可整板 · 本轮视觉参考。';fit()}
document.querySelectorAll('[data-slug]').forEach(b=>b.onclick=()=>{slug=b.dataset.slug;mode='new';update()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;update()});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;update()});let labels=false;document.querySelector('#labels').onclick=()=>{labels=!labels;art.contentWindow.postMessage({type:'labels',show:labels},location.origin);document.querySelector('#labels').textContent=labels?'隐藏编号':'显示编号'};art.addEventListener('load',()=>art.contentWindow.postMessage({type:'labels',show:labels},location.origin));const dlg=document.querySelector('#original');document.querySelector('#close').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==art.contentWindow||e.data.type!=='original')return;document.querySelector('#full').src=e.data.src;document.querySelector('#caption').textContent=e.data.title+(e.data.origin==='external-reference'?' · 新增参考':'');document.querySelector('#official').href=e.data.url;dlg.showModal()});new ResizeObserver(fit).observe(document.querySelector('main'));update();
</script></html>
