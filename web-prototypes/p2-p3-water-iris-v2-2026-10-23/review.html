<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水面入彩窗 v2 · 宽幅等比</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e6df;color:#24221f;font:13px 'Songti SC',serif}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #c5c0b5}h1{font-size:14px;font-weight:400;margin:0 12px 0 0}button,a{font:inherit;color:inherit;background:transparent;border:1px solid #a9a397;padding:6px 12px;text-decoration:none;cursor:pointer}input{width:230px;accent-color:#35312a}.frame{margin:20px auto;width:1440px;height:900px;max-width:100%;box-shadow:0 0 0 1px #c5c0b5}iframe{display:block;border:0;width:100%;height:100%}.mobile{width:390px;height:844px}p{margin:0 auto 20px;text-align:center;font-size:12px;color:#645e52}</style><header><h1>P2 → P3 · 水面折射 / 宽幅等比</h1><button id="to-water">回到水面</button><input id="progress" aria-label="转场进度" type="range" min="0" max="1000" value="0"><button id="to-window">进入彩窗</button><button id="play">往返预览</button><a id="device" href="?device=mobile">看手机版</a><a href="./?chain=1" target="_blank">接原版 P1／P2</a></header><div id="frame" class="frame"><iframe id="demo" src="./" title="水面入彩窗可滚动预览"></iframe></div><p>先拖动进度看新转场；到彩窗后继续向下滚动看完整题签，左右轻滑一次一格。</p><script>
const mobile=new URLSearchParams(location.search).get('device')==='mobile',box=document.getElementById('frame'),f=document.getElementById('demo'),slider=document.getElementById('progress');if(mobile){box.classList.add('mobile');document.getElementById('device').href='?device=desktop';document.getElementById('device').textContent='看桌面版';}
const send=(q,immediate=true)=>{f.contentWindow.postMessage({type:'review-scroll',progress:q,immediate},location.origin);slider.value=Math.round(q*1000);};document.getElementById('to-water').onclick=()=>send(0,false);document.getElementById('to-window').onclick=()=>send(1,false);slider.oninput=()=>send(slider.value/1000);let frame=null;document.getElementById('play').onclick=()=>{if(frame){cancelAnimationFrame(frame);frame=null;return;}let t0;function tick(t){t0??=t;const s=(t-t0)/9000,q=s<.48?s/.48:s<.56?1:s<1?1-(s-.56)/.44:0;send(Math.min(1,Math.max(0,q)));if(s<1)frame=requestAnimationFrame(tick);else frame=null;}frame=requestAnimationFrame(tick);};
</script></html>
