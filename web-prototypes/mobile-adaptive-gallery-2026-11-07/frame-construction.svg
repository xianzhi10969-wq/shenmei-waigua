ize="13">原图 270:270 · 四角尺寸固定</text><text x="430" y="560" font-size="16">四角：独立花饰，固定大小</text><text x="430" y="596" font-size="16">边条：只延长直线部分</text><text x="430" y="632" font-size="16">中央纹章：居中，不随边条拉伸</text><text x="430" y="668" font-size="16">内衬：等宽窄边；图像完整保留</text><text x="32" y="758" font-size="14">黑 / 白 / 灰作为独立框面。不能给整张图加滤镜，也不能把完整雕花框任意拉长。</text></svg>