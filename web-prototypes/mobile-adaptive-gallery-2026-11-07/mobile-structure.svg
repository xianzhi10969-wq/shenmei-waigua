<svg xmlns="http://www.w3.org/2000/svg" width="876" height="1300" viewBox="0 0 876 1300"><rect width="100%" height="100%" fill="white"/><style>text{fill:black;font-family:Arial,'PingFang SC',sans-serif;font-weight:400}.line{fill:none;stroke:black;stroke-width:1}.small{font-size:12px}.note{font-size:14px}</style><text x="28" y="30" font-size="20">手机：先辨认词条，再看作品与出处</text><text x="28" y="56" font-size="12">结构候选 / 黑线白底 / 素框仅表示边界</text><rect class="line" x="28" y="80" width="390" height="1120"/><rect class="line" x="458" y="80" width="390" height="1120"/><text x="52" y="117" font-size="12">← 一级专题</text><text x="318" y="117" font-size="12">切换专题</text><text x="52" y="170" font-size="12">CHAPTER 03</text><text x="52" y="234" font-size="44">田园</text><text x="180" y="234" font-size="24">Arcadia</text><text x="52" y="280" font-size="14">田园给疲惫的人一处可想象的栖身之地，</text><text x="52" y="306" font-size="14">也让人暂时放慢脚步。</text><text x="52" y="360" font-size="12">01 治愈     02 Cottagecore    03 盛夏</text><text x="52" y="436" font-size="14">01</text><text x="94" y="436" font-size="24">治愈 / Healing</text><text x="94" y="472" font-size="14">树荫里：累了，躲进来喘口气</text><rect class="line" x="55" y="517" width="336" height="114"/><rect class="line" x="61" y="523" width="324" height="102"/><rect class="line" x="64" y="526" width="318" height="96"/><path class="line" d="M64 526l318 96 M382 526l-318 96"/><text x="94" y="660" font-size="11">本节封面</text><text x="94" y="684" font-size="12">莫奈《睡莲》· 作品原有图注</text><text x="94" y="718" font-size="12">走进治愈 →                           1 个案例</text><text x="52" y="816" font-size="14">02</text><text x="94" y="816" font-size="24">Cottagecore</text><text x="94" y="850" font-size="13">树荫下的小屋：过想象中的乡下日子</text><rect class="line" x="55" y="889" width="336" height="230"/><rect class="line" x="61" y="895" width="324" height="218"/><rect class="line" x="64" y="898" width="318" height="212"/><path class="line" d="M64 898l318 212 M382 898l-318 212"/><text x="94" y="1156" font-size="12">作品图注与词条入口</text><text x="482" y="125" font-size="14">连续下滑：不同原图，框随之改变</text><rect class="line" x="511" y="175" width="284" height="318"/><rect class="line" x="517" y="181" width="272" height="306"/><rect class="line" x="520" y="184" width="266" height="300"/><path class="line" d="M520 184l266 300 M786 184l-266 300"/><text x="524" y="530" font-size="12">竖图可稍窄，完整保留，不裁人物</text><text x="524" y="555" font-size="12">展签仍与同一文字轴对齐</text><text x="482" y="635" font-size="14">03</text><text x="524" y="635" font-size="24">盛夏 / Midsummer</text><text x="524" y="673" font-size="13">太阳底下：光最满、白天最长的那几天</text><rect class="line" x="485" y="711" width="336" height="269"/><rect class="line" x="491" y="717" width="324" height="257"/><rect class="line" x="494" y="720" width="318" height="251"/><path class="line" d="M494 720l318 251 M812 720l-318 251"/><text x="524" y="1015" font-size="12">作品署名 / 年代 / 来源</text><text x="524" y="1050" font-size="12">走进盛夏 →                           5 个案例</text><text x="482" y="1155" font-size="14">04 生命力 · 更新中（不放空画框）</text><text x="28" y="1240" font-size="13">规则：页边24；图文分层；框内衬3；框边9；条目之间72；原图比例决定框高。</text><text x="28" y="1270" font-size="13">柱子和檐口不进入手机稿。新雕花只附着于画框，不再漂浮在页面边缘。</text></svg>