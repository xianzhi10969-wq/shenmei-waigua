<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>过渡研究 · wave</title>
<style>html,body{margin:0;background:#F6F3ED}.p1{height:70vh;background:#F6F3ED;display:flex;align-items:center;justify-content:center;font:20px Georgia,serif;color:#1E1E1E}
.p2{height:70vh;background:#1E1E1E;color:#F6F3ED;display:flex;align-items:center;justify-content:center;font:20px Georgia,serif}
.band{position:relative;height:clamp(240px,40vh,420px);overflow:hidden}.band svg{position:absolute;inset:0;width:100%;height:100%}
.band .m{position:absolute;inset:0;background:#F6F3ED;transform-origin:bottom}</style>
<div class=p1>P1 · 纸面</div><div class=band><svg preserveAspectRatio="none"></svg><div class=m></div></div><div class=p2>P2 · 夜水</div>
<script src=common.js></script><script>
const b=document.querySelector('.band'),sv=b.querySelector('svg'),m=b.querySelector('.m');
function draw(){band(sv,Math.max(390,b.clientWidth),b.clientHeight,'wave');}draw();addEventListener('resize',draw);
// 滚动驱动：纸色遮罩自下而上退去（硬边，不做透明度渐变），刻线"被刻出"
function f(){const r=b.getBoundingClientRect(),p=Math.min(1,Math.max(0,(innerHeight-r.top)/(innerHeight*0.9)));
 m.style.transform='scaleY('+(1-p).toFixed(3)+')';m.style.transformOrigin='top';}
if(matchMedia('(prefers-reduced-motion: reduce)').matches) m.style.display='none'; else {addEventListener('scroll',f,{passive:true});f();}
if(location.hash=='#static')m.style.display='none';
</script>
