<title>审美外挂 · P3 彩窗 v2（待夕里审 · 非基线）</title>

<style>
@font-face{font-family:CabinetSong;src:url(assets/cabinet-song.ttf) format("truetype");font-display:block}
:root{--ink:#1E1E1E;--paper:#F6F3ED}
html,body{margin:0;background:var(--paper)}
body{overflow-x:hidden}
/* ---- P1/P2：桌面直接沿用 v4 的图层与时间（素材为副本） */
#desk{position:relative;width:1440px;margin:0 auto}
#p1{position:relative;width:1440px;height:900px;background:#f9f6ef}
#p1 .lay{position:absolute;left:0;top:64px;width:1440px;height:836px;opacity:0}
#text{position:absolute;left:0;top:0;width:1440px;height:900px;opacity:0;animation:fade 1.1s cubic-bezier(.22,.61,.36,1) .2s forwards}
#bg{animation:wipe 1.2s cubic-bezier(.22,.61,.36,1) 0s forwards}
#shrine{animation:wipe 1.0s cubic-bezier(.22,.61,.36,1) .7s forwards}
#woman{animation:wipe 1.1s cubic-bezier(.22,.61,.36,1) 1.2s forwards}
@keyframes fade{to{opacity:1}}
@keyframes wipe{from{opacity:0;clip-path:inset(0 0 18% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
#p2{display:block;width:1440px;height:811px}
#mob{display:none}
#mob img{display:block;width:100%;height:auto}
body.m #desk{display:none} body.m #mob{display:block}
@media (max-width:899px){#desk{display:none}#mob{display:block}}
body.p3only #desk,body.p3only #mob{display:none}
/* ---- P3 舞台 */
#p3{position:relative;height:380vh}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--paper)}
.win{position:absolute;overflow:visible}
body.m .win.web,body:not(.m) .win.mobile{display:none}
.win img.lineart,.win img.orn,.win>svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.win img.lineart{clip-path:inset(100% 0 0 0)} .win img.orn{opacity:0}
.win text{fill:var(--ink);text-anchor:middle}
.win .zh{font-family:CabinetSong,"Noto Serif CJK SC",serif;letter-spacing:.14em}
.win .la{font-family:Georgia,serif;font-style:italic;letter-spacing:.2em}
.cfill{fill:var(--paper)}
.lab.hot .cfill{fill:var(--ink)} .lab.hot text{fill:var(--paper)}
.win .hit{fill:transparent;stroke:none!important;cursor:pointer;outline:none}
.win .hot-frame{fill:none;stroke:var(--ink);stroke-width:calc(2.2 * var(--k,1))}
#cap{position:absolute;left:4vw;top:50%;width:min(22vw,300px);transform:translateY(-50%);color:var(--ink);font-family:CabinetSong,"Noto Serif CJK SC",serif;opacity:0;transition:opacity .25s;z-index:4;pointer-events:none}
#cap.on{opacity:1}
#cap .zh{font-size:28px;letter-spacing:.14em;margin:0 0 4px}
#cap .la{font:italic 12px Georgia,serif;letter-spacing:.2em;margin:0 0 18px}
#cap .def{font-size:17px;line-height:1.8;margin:0 0 16px}
#cap .cr{font:11px/1.6 "Noto Serif CJK SC",serif;margin:0;border-top:1px solid var(--ink);padding-top:8px}
body.m #cap{left:6vw;right:6vw;width:auto;top:2.2vh;transform:none;text-align:center}
body.m #cap .zh{display:none} body.m #cap .la{display:none} body.m #cap .def{font-size:14px;line-height:1.7;margin:0 0 4px} body.m #cap .cr{font-size:9px;border:0;padding:0}
.roseStar{display:none}
.night{position:absolute;left:0;right:0;background:var(--ink);will-change:transform}
.sky{top:0;background:var(--ink) no-repeat center bottom/100% auto}
.water{bottom:0}
.wline{position:absolute;left:0;right:0;top:0;height:1px;background:var(--paper)}
#star{position:fixed;left:0;top:0;width:156px;height:156px;z-index:20;pointer-events:none;will-change:transform,opacity;opacity:0}
#star svg{position:absolute;inset:0;width:100%;height:100%}
#sCream{opacity:0}
body.m #star{width:90px;height:90px}
.nav{position:absolute;bottom:calc(3vh + 6px);width:44px;height:44px;border:0;background:none;font:22px Georgia,serif;color:var(--ink);display:none;z-index:5}
body.m .nav{display:block}
.note{position:absolute;right:14px;bottom:10px;font:11px/1.5 "Noto Serif CJK SC",serif;color:var(--ink);opacity:1;z-index:6}
body.m .note{left:8px;right:8px;bottom:4px;font-size:9px;text-align:center}
#after{height:60vh;display:flex;align-items:center;justify-content:center;font:13px "Noto Serif CJK SC",serif;color:var(--ink)}
@media (prefers-reduced-motion: reduce){
  #p3{height:auto} .stage{position:relative;height:100vh}
  .night{display:none} .win img.lineart{clip-path:none} .win img.orn{opacity:1}
  .roseStar{display:inline}
  #bg,#shrine,#woman,#text{animation:none;opacity:1}
}

<script>
const LAY={"web": {"W": 915, "H": 988, "rose": {"cx": 462, "cy": 232, "R": 84}, "sill": [940, 988]}, "mobile": {"W": 392, "H": 916, "rose": {"cx": 196, "cy": 200, "R": 68}, "sill": [859, 916]}}, TOPICS={"liubai": {"zh": "留白", "la": "Liubai", "cover": "assets/feishu/covers/liubai.jpg", "define": "留白不是空着省事，而是把必要的线索放好，再让观众走进未画出的部分。", "credit": "马远《寒江独钓图》（南宋，东京国立博物馆）· 公有领域 · 图源 Wikimedia Commons", "record": "reczz28HJJL2A7Oz"}, "melancholy": {"zh": "忧郁", "la": "Melancholy", "cover": "assets/feishu/covers/melancholy.jpeg", "define": "忧郁，是生活还在继续，而有一部分自己停在了原地。", "credit": "Vilhelm Hammershøi《Interior, Strandgade 30》", "record": "reczz28HJJL2A77K"}, "eros": {"zh": "爱欲", "la": "Eros", "cover": "assets/feishu/covers/eros.jpg", "define": "爱欲从缺口里生长：你想要的还没得到，因此一直向它靠近。", "credit": "约翰内斯·维米尔《窗前读信的少女》（约 1657–1659，德累斯顿历代大师画廊）· 公有领域 · 图源 Wikimedia Commons", "record": "reczz28HJJL2A7BH"}, "arcadia": {"zh": "田园", "la": "Arcadia", "cover": "assets/feishu/covers/arcadia.jpg", "define": "田园给疲惫的人一处可想象的栖身之地，也让人暂时放慢脚步。", "credit": "文森特·凡·高《麦田里的收割者》（1889，阿姆斯特丹凡·高博物馆）· 公有领域 · 图源 Wikimedia Commons", "record": "reczz28HJJL2A7E0"}, "yugen": {"zh": "幽玄", "la": "Yūgen", "cover": "assets/feishu/covers/yugen.jpg", "define": "幽玄把可见的部分留在眼前，让更深的一层停在难以说尽的地方。", "credit": "上村松园《序之舞》（1936，东京艺术大学大学美术馆）· 公有领域 · 图源 Wikimedia Commons", "record": "reczz28HJJL2A7HL"}}, ORDER=Object.keys(TOPICS);
const Q=new URLSearchParams(location.search);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const B=document.body; if(Q.get('slots'))B.classList.add('slots'); if(Q.get('p3only'))B.classList.add('p3only');
const cl=(v,a,b)=>Math.min(1,Math.max(0,(v-a)/(b-a))), ss=t=>t*t*(3-2*t), lerp=(a,b,t)=>a+(b-a)*t;
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
let M=false, win, L, sc=1, wx=0, wy=0, ready=reduce;
const star=$('#star'), sInk=$('#sInk'), sCream=$('#sCream'), stage=$('#stage'), sky=$('#sky'), water=$('#water');
function layout(){
  M=matchMedia('(max-width:899px)').matches; B.classList.toggle('m',M);
  win=$(M?'.win.mobile':'.win.web'); L=LAY[M?'mobile':'web'];
  const vh=innerHeight, vw=innerWidth;
  const h=Math.min(vh*(M?.8:.88),(vw*(M?.94:.9))*L.H/L.W); sc=h/L.H; const w=L.W*sc;
  wx=(vw-w)/2; wy=vh*(M?.985:.975)-L.sill[1]*sc;
  Object.assign(win.style,{left:wx+'px',top:wy+'px',width:w+'px',height:h+'px'}); win.style.setProperty('--k',(1/sc).toFixed(4));
  const sill=wy+L.sill[0]*sc; sky.style.height=sill+'px'; water.style.height=(vh-sill)+'px';
  sky.style.backgroundImage=`url(assets/junction-water-${M?'mob':'desk'}.png)`;
  $$('.nav').forEach(b=>{b.style.bottom='auto';b.style.top=(wy+.6*L.H*sc-22)+'px'}); $('#prev').style.left=(wx+2)+'px'; $('#next').style.left=(wx+w-46)+'px';
  update();
}
// --- 起点：桌面 = v4 星 B（神龛→P2 水面）；手机 = Figma 手机 P2 画上的水面星位置
const ST=156, V4={x0:798,y0:422,x1:382,y1:1448,TOP:900};
function chainEnd(){ return $('#p3').offsetTop; }
function docStart(){ // P2 水面星（文档坐标，星中心）
  if(B.classList.contains('p3only')) return null;
  if(!M) return {x:V4.x1+($('#desk').getBoundingClientRect().left+scrollX),y:V4.y1};
  const k=innerWidth/390; return {x:70*k,y:(844+859)*k};
}
function update(){ queued=false;
  const vh=innerHeight, y=scrollY, T=chainEnd(), sr=stage.getBoundingClientRect();
  const span=$('#p3').offsetHeight-vh, q=reduce?1:Math.min(1,Math.max(0,(y-T)/span));
  const size=M?90:ST, half=size/2;
  $$('.nav').forEach(b=>b.style.visibility=(q>.85||reduce)?'visible':'hidden');
  const sillS=sr.top+wy+L.sill[0]*sc, cxS=sr.left+wx+L.rose.cx*sc, roseS=sr.top+wy+L.rose.cy*sc;
  // 夜退：天空从水面线向上收，水面向下沉
  const n=ss(cl(q,.08,.30));
  sky.style.clipPath=`inset(0 0 ${(n*100).toFixed(2)}% 0)`; water.style.transform=`translateY(${(n*(vh-(wy+L.sill[0]*sc))+2*n).toFixed(1)}px)`;
  // 窗花自下而上描线；题签框与窗台同时
  { const t=reduce?1:ss(cl(q,.16,.62)); win.querySelector('img.lineart').style.clipPath=reduce?'none':`inset(${((1-t)*100).toFixed(2)}% 0 0 0)`; }
  { const o=reduce?1:ss(cl(q,.48,.66)); const im=win.querySelector('img.orn'); im.style.opacity=o.toFixed(3); im.style.clipPath=reduce?'none':`inset(${((1-o)*100).toFixed(2)}% 0 0 0)`; }
  if(M) showCap(q>.85||reduce?ORDER[idx]:null);
  // 封面：中窗先亮，再向两侧（轴线与秩序）
  $$('.rv',win).forEach((r,i)=>{ const n=r.closest('clipPath').id.slice(-1)*1, mid=M?1:2, d=Math.abs(n-mid);
    const t=reduce?1:ss(cl(q,.58+d*.06,.72+d*.06)); const Y=+r.dataset.y, H=+r.dataset.h;
    r.setAttribute('y',(Y+H*(1-t)).toFixed(1)); r.setAttribute('height',(H*t).toFixed(1)); });
  $$('.tv',win).forEach(r=>{ const n=+r.closest('.lab').dataset.i, mid=M?1:2, d=Math.abs(n-mid);
    const t=reduce?1:ss(cl(q,.70+d*.05,.80+d*.05)); r.setAttribute('width',(+r.dataset.w*t).toFixed(1)); });
  // ---- 星
  let sx,sy,ink, op=1;
  const s0=docStart();
  if(reduce){ // v4：星停在神龛；彩窗中显示静态星
    op=(!M&&s0)?1:0; sx=V4.x0+($('#desk').getBoundingClientRect().left); sy=V4.y0-y; ink=1;
  } else {
    const S1=T-vh; const bodyL=M?0:$('#desk').getBoundingClientRect().left;
    if(s0 && y<=S1){
      if(!M){ const p=S1>0?Math.min(1,Math.max(0,y/S1)):1, g=ss(cl(p,.03,1));
        const dx=(V4.x1-V4.x0)*(1-Math.pow(1-g,2)), dy=(V4.y1-V4.y0)*(g*g*.35+g*.65);
        sx=bodyL+V4.x0+dx; sy=V4.y0+dy-y; const c=ss(cl(V4.y0+dy,V4.TOP-30,V4.TOP+50)); ink=1-c; op=ready?1:0;
      } else { sx=s0.x; sy=s0.y-y; ink=0; }
    } else if(s0 && y<T){ const g=ss(cl(y,S1,T));
      const a={x:s0.x+(M?0:0),y:s0.y-y}; if(!M) a.x=bodyL+V4.x1;
      sx=lerp(a.x,cxS,1-Math.pow(1-g,2)); sy=lerp(a.y,sillS-half*.5,g); ink=0;
    } else {
      const r=ss(cl(q,.28,.66));
      sx=cxS; sy=lerp(sillS-half*.5,roseS,r); ink=s0?ss(cl(q,.10,.18)):1;
    }
  }
  const rot=0; star.style.transform=`translate3d(${(sx-half).toFixed(1)}px,${(sy-half).toFixed(1)}px,0) rotate(${rot}deg)`;
  sInk.style.opacity=ink.toFixed(3); sCream.style.opacity=(1-ink).toFixed(3); star.style.opacity=op;
}
let queued=false; addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(update)}},{passive:true});
addEventListener('resize',layout);
// v4 载入：星 B 2.0s 起 0.9s 淡入
if(!reduce){ setTimeout(()=>{ready=true;update()},2900); window.__forceReady=()=>{ready=true;update()}; }
// ---- 交互：桌面 hover/focus 高亮；手机 tap 侧窗换专题
function showCap(s){ const c=$('#cap'); if(!s){c.classList.remove('on');return;} const t=TOPICS[s], p=$$('p',c);
  p[0].textContent=t.zh; p[1].textContent=t.la.toUpperCase(); p[2].textContent=t.define; p[3].textContent='封面：'+t.credit; c.classList.add('on'); }
function hot(i,on){ if(!M) showCap(on?ORDER[i]:null); $$('.lab',win).forEach(l=>l.classList.toggle('hot',on&&+l.dataset.i===i));
  $$('.hot-frame',win).forEach(f=>{ f.style.display=(on&&+f.dataset.i===i)?'inline':'none'; }); }
let idx=2; function setMob(k){ idx=(k+5)%5; const w=$('.win.mobile');
  $$('image.cov',w).forEach((im,i)=>{const s=ORDER[(idx+i-1+5)%5]; im.dataset.slug=s; im.setAttribute('href',TOPICS[s].cover);});
  $$('.lab',w).forEach((l,i)=>{const s=ORDER[(idx+i-1+5)%5]; const t=$$('text',l); t[0].textContent=TOPICS[s].zh; t[1].textContent=TOPICS[s].la.toUpperCase(); }); showCap(ORDER[idx]); }
$$('.hit').forEach(h=>{ const i=+h.dataset.i, mob=h.closest('.mobile');
  if(!mob){ h.addEventListener('pointerenter',()=>hot(i,true)); h.addEventListener('pointerleave',()=>hot(i,false));
    h.addEventListener('focus',()=>hot(i,true)); h.addEventListener('blur',()=>hot(i,false)); }
  else h.addEventListener('click',()=>{ if(i===0)setMob(idx-1); else if(i===2)setMob(idx+1); else { const on=!$$('.lab',win)[1].classList.contains('hot'); hot(1,on);} });
});
$('#prev').onclick=()=>setMob(idx-1); $('#next').onclick=()=>setMob(idx+1);
let px=null; stage.addEventListener('pointerdown',e=>{px=e.clientX}); stage.addEventListener('pointerup',e=>{ if(M&&px!==null&&Math.abs(e.clientX-px)>40) setMob(idx+(e.clientX<px?1:-1)); px=null; });
window.__q=v=>{ scrollTo(0,chainEnd()+v*($('#p3').offsetHeight-innerHeight)); };
addEventListener('load',layout); layout();
</script></body></html>
